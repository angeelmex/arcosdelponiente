<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #204d5d;
    }


    .pagina {
      min-height: 100vh;
      padding: 16px 14px 30px;
    }


    .contenedor {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }


    .encabezado {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }


    .volver {
      width: 54px;
      min-width: 54px;
      height: 54px;
      border-radius: 16px;
      background: white;
      color: #204d5d;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
      box-shadow:
        0 5px 16px
        rgba(20,55,95,.09);
    }


    .titulo {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }


    .subtitulo {
      margin-top: 4px;
      font-size: 13px;
      color: #718198;
    }


    .resumen {
      background: white;
      border-radius: 20px;
      padding: 15px 16px;
      margin-bottom: 18px;
      box-shadow:
        0 5px 18px
        rgba(20,55,95,.08);
    }


    .resumen-titulo {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }


    .resumen-texto {
      margin-top: 5px;
      font-size: 13px;
      color: #718198;
      line-height: 1.45;
    }


    .cargando {
      background: white;
      border-radius: 20px;
      padding: 30px 18px;
      text-align: center;
      color: #748399;
      box-shadow:
        0 5px 18px
        rgba(20,55,95,.07);
    }


    .grupo-calle {
      margin-bottom: 22px;
    }


    .calle-titulo {
      margin:
        0 2px 10px;
      font-size: 18px;
      font-weight: 800;
      color: #204d5d;
    }


    .lista {
      display: grid;
      gap: 12px;
    }


    .tarjeta {
      overflow: hidden;
      background: white;
      border-radius: 20px;
      box-shadow:
        0 5px 18px
        rgba(20,55,95,.09);
    }


    .foto {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e9eef2;
    }


    .datos {
      padding: 14px 15px 16px;
    }


    .fila-principal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }


    .hora {
      font-size: 14px;
      font-weight: 800;
      color: #204d5d;
    }


    .estado {
      padding:
        5px 9px;
      border-radius: 999px;
      background: #e9f7ee;
      color: #267245;
      font-size: 11px;
      font-weight: 800;
    }


    .observacion {
      margin-top: 9px;
      color: #718198;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-line;
    }


    .sin-registros {
      background: white;
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
      color: #748399;
      line-height: 1.5;
      box-shadow:
        0 5px 18px
        rgba(20,55,95,.07);
    }


    .sin-registros .icono {
      display: block;
      margin-bottom: 10px;
      font-size: 42px;
    }


    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2500;
      background:
        rgba(8,18,30,.82);
      align-items: center;
      justify-content: center;
      padding: 14px;
    }


    .modal {
      width: 100%;
      max-width: 680px;
    }


    .modal img {
      display: block;
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 18px;
      background: white;
    }


    .modal-cerrar {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: none;
      border-radius: 16px;
      background: white;
      color: #204d5d;
      font-size: 15px;
      font-weight: 800;
    }


    .mensaje {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 22px;
      z-index: 3000;
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      background: #fdeaea;
      color: #9b3333;
      box-shadow:
        0 7px 24px
        rgba(0,0,0,.14);
    }

  </style>

  <title>Seguridad</title>

</head>


<body>


<div class="pagina">

  <div class="contenedor">


    <div class="encabezado">

      <a
        class="volver"
        href="menu.html"
        aria-label="Volver al menú"
      >
        ←
      </a>


      <div>

        <h1 class="titulo">
          Seguridad
        </h1>

        <div class="subtitulo">
          Patrullaje del día
        </div>

      </div>

    </div>



    <div class="resumen">

      <div class="resumen-titulo">
        Registro diario
      </div>

      <div
        id="resumenTexto"
        class="resumen-texto"
      >
        Cargando información...
      </div>

    </div>



    <div
      id="cargando"
      class="cargando"
    >
      Cargando fotografías...
    </div>



    <div
      id="contenido"
      style="display:none;"
    ></div>


  </div>

</div>



<div
  id="modalFoto"
  class="modal-fondo"
>

  <div class="modal">

    <img
      id="fotoAmpliada"
      alt="Fotografía de patrullaje"
    >

    <button
      type="button"
      class="modal-cerrar"
      onclick="cerrarFoto()"
    >
      CERRAR
    </button>

  </div>

</div>



<div
  id="mensaje"
  class="mensaje"
></div>




<form
  id="formSeguridad"
  method="post"
  action="https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec"
  target="iframeSeguridad"
  style="display:none;"
>

  <input type="hidden" id="seguridadAccion" name="accion">
  <input type="hidden" id="seguridadToken" name="token">
  <input type="hidden" id="seguridadRequestId" name="requestId">

</form>


<iframe
  id="iframeSeguridad"
  name="iframeSeguridad"
  style="display:none;width:0;height:0;border:0;"
  title="Procesando seguridad"
></iframe>


<script>


const URL_BACKEND =
  "https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec";


let TOKEN =
  "";



document.addEventListener(
  "DOMContentLoaded",
  cargarSeguridad
);



const CACHE_LOCAL_SEGURIDAD_V3 =
  "arcos_seguridad_cache_v3";

const MILISEGUNDOS_CACHE_LOCAL_SEGURIDAD_V3 =
  45 * 1000;


function cargarSeguridad() {

  TOKEN =
    sessionStorage.getItem(
      "tokenResidente"
    ) || "";


  if (
    !TOKEN
  ) {

    window.location.href =
      "login.html";

    return;

  }


  /*
   * Si ya tenemos una copia reciente en este teléfono,
   * la mostramos inmediatamente.
   */
  const cacheLocal =
    obtenerCacheLocalSeguridadV3_();


  if (
    cacheLocal &&
    cacheLocal.datos
  ) {

    pintarSeguridadV3_(
      cacheLocal.datos
    );


    if (
      Date.now() -
      cacheLocal.fecha <
      MILISEGUNDOS_CACHE_LOCAL_SEGURIDAD_V3
    ) {

      return;

    }

  }


  ejecutarOperacionSeguridadV3(
    "seguridadHoy",

    function(resultado) {

      if (
        !resultado ||
        !resultado.ok
      ) {

        if (
          !cacheLocal
        ) {

          document
            .getElementById(
              "cargando"
            )
            .style.display =
              "none";


          mostrarError(
            resultado &&
            resultado.mensaje
              ? resultado.mensaje
              : "No fue posible cargar seguridad."
          );

        }


        return;

      }


      const datos =
        resultado.datos ||
        {
          fecha: "",
          registros: []
        };


      guardarCacheLocalSeguridadV3_(
        datos
      );


      pintarSeguridadV3_(
        datos
      );

    },

    function() {

      if (
        cacheLocal
      ) {

        return;

      }


      document
        .getElementById(
          "cargando"
        )
        .style.display =
          "none";


      mostrarError(
        "No fue posible cargar seguridad."
      );

    }
  );

}


function pintarSeguridadV3_(
  datos
) {

  datos =
    datos ||
    {
      fecha: "",
      registros: []
    };


  const registros =
    datos.registros ||
    [];


  document
    .getElementById(
      "resumenTexto"
    )
    .textContent =
      datos.fecha
        ? (
            "Registros correspondientes al " +
            datos.fecha +
            "."
          )
        : "Registros del día.";


  renderizarRegistros(
    registros
  );


  document
    .getElementById(
      "cargando"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "contenido"
    )
    .style.display =
      "block";

}


function obtenerCacheLocalSeguridadV3_() {

  try {

    const textoCache =
      sessionStorage.getItem(
        CACHE_LOCAL_SEGURIDAD_V3
      );


    if (
      !textoCache
    ) {

      return null;

    }


    const cache =
      JSON.parse(
        textoCache
      );


    if (
      !cache ||
      !cache.fecha ||
      !cache.datos ||
      !Array.isArray(
        cache.datos.registros
      )
    ) {

      return null;

    }


    return cache;

  }
  catch (error) {

    return null;

  }

}


function guardarCacheLocalSeguridadV3_(
  datos
) {

  try {

    sessionStorage.setItem(
      CACHE_LOCAL_SEGURIDAD_V3,
      JSON.stringify(
        {
          fecha:
            Date.now(),

          datos:
            datos
        }
      )
    );

  }
  catch (error) {

    /*
     * El caché local es solo una optimización.
     */

  }

}



/*************************************************
 * RENDERIZAR
 *************************************************/

function renderizarRegistros(
  registros
) {


  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.innerHTML =
    "";


  if (
    !registros.length
  ) {

    contenido.innerHTML =
      '<div class="sin-registros">' +
        '<span class="icono">🛡️</span>' +
        '<strong>Aún no hay registros de patrullaje de hoy.</strong>' +
        '<br>Cuando se carguen fotografías aparecerán aquí.' +
      '</div>';

    return;

  }


  const grupos =
    {};


  registros.forEach(
    function(registro) {

      const calle =
        registro.calle ||
        "Sin calle";


      if (
        !grupos[calle]
      ) {

        grupos[calle] =
          [];

      }


      grupos[calle].push(
        registro
      );

    }
  );


  Object.keys(
    grupos
  )
    .sort(
      function(a, b) {

        return a.localeCompare(
          b,
          "es",
          {
            sensitivity:
              "base"
          }
        );

      }
    )
    .forEach(
      function(calle) {


        const seccion =
          document.createElement(
            "section"
          );


        seccion.className =
          "grupo-calle";


        const titulo =
          document.createElement(
            "h2"
          );


        titulo.className =
          "calle-titulo";


        titulo.textContent =
          calle;


        const lista =
          document.createElement(
            "div"
          );


        lista.className =
          "lista";


        grupos[calle].forEach(
          function(registro) {

            lista.appendChild(
              crearTarjeta(
                registro
              )
            );

          }
        );


        seccion.appendChild(
          titulo
        );


        seccion.appendChild(
          lista
        );


        contenido.appendChild(
          seccion
        );

      }
    );

}



/*************************************************
 * TARJETA
 *************************************************/

function crearTarjeta(
  registro
) {


  const tarjeta =
    document.createElement(
      "div"
    );


  tarjeta.className =
    "tarjeta";


  const foto =
    document.createElement(
      "img"
    );


  foto.className =
    "foto";


  /*
   * Las fotos fuera de pantalla no se descargan
   * hasta que el usuario se acerca a ellas.
   */
  foto.loading =
    "lazy";


  foto.decoding =
    "async";


  foto.src =
    registro.foto;


  foto.alt =
    "Patrullaje " +
    registro.calle;


  foto.addEventListener(
    "click",
    function() {

      abrirFoto(
        registro.foto
      );

    }
  );


  const datos =
    document.createElement(
      "div"
    );


  datos.className =
    "datos";


  let html =
    '<div class="fila-principal">' +

      '<div class="hora">' +
        (
          registro.hora
            ? "🕒 " +
              escaparHtml(
                registro.hora
              )
            : "Registro del día"
        ) +
      '</div>' +

      '<div class="estado">' +
        'VERIFICADO' +
      '</div>' +

    '</div>';


  if (
    registro.observacion
  ) {

    html +=
      '<div class="observacion">' +
        escaparHtml(
          registro.observacion
        ) +
      '</div>';

  }


  datos.innerHTML =
    html;


  tarjeta.appendChild(
    foto
  );


  tarjeta.appendChild(
    datos
  );


  return tarjeta;

}



/*************************************************
 * FOTO GRANDE
 *************************************************/

function abrirFoto(
  url
) {


  document
    .getElementById(
      "fotoAmpliada"
    )
    .src =
      url;


  document
    .getElementById(
      "modalFoto"
    )
    .style.display =
      "flex";

}



function cerrarFoto() {


  document
    .getElementById(
      "modalFoto"
    )
    .style.display =
      "none";

}



/*************************************************
 * MOTOR DE OPERACIONES EXTERNAS V3
 *************************************************/

let OPERACION_SEGURIDAD =
  null;


const MAX_CONSULTAS_SEGURIDAD =
  35;


function ejecutarOperacionSeguridadV3(
  accion,
  alTerminar,
  alFallar
) {

  if (
    OPERACION_SEGURIDAD
  ) {

    return;

  }


  const requestId =
    generarRequestIdSeguridadV3();


  OPERACION_SEGURIDAD = {
    requestId:
      requestId,

    alTerminar:
      alTerminar,

    alFallar:
      alFallar,

    consultas:
      0
  };


  document
    .getElementById(
      "seguridadAccion"
    )
    .value =
      accion;


  document
    .getElementById(
      "seguridadToken"
    )
    .value =
      TOKEN;


  document
    .getElementById(
      "seguridadRequestId"
    )
    .value =
      requestId;


  document
    .getElementById(
      "formSeguridad"
    )
    .submit();


  setTimeout(
    consultarEstadoSeguridadV3,
    700
  );

}


function consultarEstadoSeguridadV3() {

  if (
    !OPERACION_SEGURIDAD
  ) {

    return;

  }


  OPERACION_SEGURIDAD.consultas++;


  if (
    OPERACION_SEGURIDAD.consultas >
      MAX_CONSULTAS_SEGURIDAD
  ) {

    terminarSeguridadConError();

    return;

  }


  window.recibirEstadoSeguridadV3 =
    function(resultado) {

      procesarEstadoSeguridadV3(
        resultado
      );

    };


  const anterior =
    document.getElementById(
      "consultaSeguridadV3"
    );


  if (
    anterior
  ) {

    anterior.remove();

  }


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "consultaSeguridadV3";


  script.src =
    URL_BACKEND +
    "?api=operacionEstado" +
    "&requestId=" +
    encodeURIComponent(
      OPERACION_SEGURIDAD.requestId
    ) +
    "&callback=recibirEstadoSeguridadV3" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      script.remove();


      if (
        OPERACION_SEGURIDAD
      ) {

        setTimeout(
          consultarEstadoSeguridadV3,
          700
        );

      }

    };


  document.body.appendChild(
    script
  );

}


function procesarEstadoSeguridadV3(
  resultado
) {

  const script =
    document.getElementById(
      "consultaSeguridadV3"
    );


  if (
    script
  ) {

    script.remove();

  }


  if (
    !OPERACION_SEGURIDAD
  ) {

    return;

  }


  if (
    !resultado ||
    !resultado.ok
  ) {

    terminarSeguridadConError();

    return;

  }


  const datos =
    resultado.datos || {};


  if (
    datos.estado ===
      "PENDIENTE"
  ) {

    setTimeout(
      consultarEstadoSeguridadV3,
      700
    );

    return;

  }


  if (
    datos.estado !==
      "LISTO" ||
    !datos.resultado
  ) {

    terminarSeguridadConError();

    return;

  }


  const operacion =
    OPERACION_SEGURIDAD;


  OPERACION_SEGURIDAD =
    null;


  if (
    typeof operacion.alTerminar ===
      "function"
  ) {

    operacion.alTerminar(
      datos.resultado
    );

  }

}


function terminarSeguridadConError() {

  if (
    !OPERACION_SEGURIDAD
  ) {

    return;

  }


  const operacion =
    OPERACION_SEGURIDAD;


  OPERACION_SEGURIDAD =
    null;


  if (
    typeof operacion.alFallar ===
      "function"
  ) {

    operacion.alFallar();

  }

}


function generarRequestIdSeguridadV3() {

  if (
    window.crypto &&
    typeof crypto.randomUUID ===
      "function"
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}



/*************************************************
 * ERROR
 *************************************************/

function mostrarError(
  textoMensaje
) {


  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.textContent =
    textoMensaje;


  mensaje.style.display =
    "block";


  setTimeout(
    function() {

      mensaje.style.display =
        "none";

    },
    3500
  );

}



/*************************************************
 * TEXTO SEGURO
 *************************************************/

function escaparHtml(
  valor
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    valor || "";


  return div.innerHTML;

}



/*************************************************
 * CERRAR FOTO AL TOCAR FONDO
 *************************************************/

window.addEventListener(
  "click",
  function(evento) {


    const modal =
      document.getElementById(
        "modalFoto"
      );


    if (
      evento.target ===
      modal
    ) {

      cerrarFoto();

    }

  }
);


</script>


</body>

</html>
