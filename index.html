<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="theme-color" content="#204d5d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arcos del Poniente">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>Arcos del Poniente</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f4f7fb;

      color:
        #204d5d;

    }

    .pagina {

      min-height: 100vh;

      padding:
        10px 14px 30px;

    }

    .contenedor {

      width: 100%;

      max-width: 520px;

      margin: 0 auto;

    }

    .tarjeta {

      background: white;

      border-radius: 24px;

      padding: 15px;

      box-shadow:
        0 8px 25px
        rgba(20, 55, 95, 0.10);

    }

    .titulo {

      text-align: center;

      margin:
        3px 0 14px;

      font-size: 21px;

      font-weight: 800;

      color:
        #204d5d;

    }

    .contenedor-imagen {

      width: 100%;

      min-height: 320px;

      border-radius: 18px;

      background:
        #edf3f7;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    .imagen-aviso {

      display: none;

      width: 100%;

      height: auto;

      max-height: 560px;

      object-fit: contain;

    }

    .sin-aviso {

      display: none;

      padding:
        50px 25px;

      text-align: center;

      color:
        #718198;

      line-height: 1.5;

    }

    .sin-aviso-icono {

      font-size: 50px;

      margin-bottom: 12px;

    }

    .texto {

      margin:
        18px 8px;

      text-align: center;

      color:
        #6c7c91;

      font-size: 15px;

      line-height: 1.4;

    }

    .boton {

      width: 100%;

      min-height: 64px;

      border: none;

      border-radius: 18px;

      background:
        #204d5d;

      color: white;

      font-size: 20px;

      font-weight: 800;

      cursor: pointer;

    }

    .boton:active {

      transform:
        scale(0.99);

    }

    .cargando {

      text-align: center;

      color:
        #718198;

      padding: 30px;

    }

    .estado {

      display: none;

      margin-top: 15px;

      padding: 14px;

      border-radius: 14px;

      text-align: center;

      background:
        #fff3cd;

      color:
        #745d00;

      font-weight: 700;

    }

  </style>

</head>


<body>


<div class="pagina">

  <div class="contenedor">


    <div class="tarjeta">


      <div class="titulo">
        Avisos
      </div>


      <div
        id="contenedorImagen"
        class="contenedor-imagen"
      >


        <div
          id="cargando"
          class="cargando"
        >
          Cargando aviso...
        </div>


        <img
          id="imagenAviso"
          class="imagen-aviso"
          alt="Aviso de la colonia"
          decoding="async"
          fetchpriority="high"
        >


        <div
          id="sinAviso"
          class="sin-aviso"
        >

          <div class="sin-aviso-icono">
            📢
          </div>

          No hay un aviso publicado
          en este momento.

        </div>


      </div>


      <div class="texto">

        Consulta los avisos recientes
        de la colonia antes de continuar.

      </div>


      <button
        id="btnAcceder"
        class="boton"
        onclick="irLogin()"
      >
        ACCEDER
      </button>


      <div
        id="estadoSistema"
        class="estado"
      >

        El sistema se encuentra
        temporalmente fuera de servicio.

      </div>


    </div>


  </div>

</div>


<script>


const URL_BACKEND =
  "https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec";

/*
 * Cache visual de Inicio/Login.
 *
 * La portada cambia poco, así que mostramos inmediatamente
 * la última versión conocida y luego consultamos Apps Script
 * en segundo plano para comprobar si existe una nueva.
 */
const CACHE_DATOS_PUBLICOS_V3 =
  "arcos_datos_publicos_v3";

const MAX_EDAD_CACHE_INICIO_MS =
  21 * 24 * 60 * 60 * 1000;


function guardarCacheDatosPublicosV3_(
  datos
) {

  try {

    localStorage.setItem(
      CACHE_DATOS_PUBLICOS_V3,
      JSON.stringify(
        {
          fecha:
            Date.now(),

          datos:
            datos || {}
        }
      )
    );

  }
  catch (error) {}

}



function leerCacheDatosPublicosV3_(
  maxEdad
) {

  try {

    const textoCache =
      localStorage.getItem(
        CACHE_DATOS_PUBLICOS_V3
      );


    if (
      !textoCache
    ) {

      return null;

    }


    const cache =
      JSON.parse(
        textoCache
      );


    if (
      !cache ||
      !cache.fecha ||
      !cache.datos
    ) {

      return null;

    }


    if (
      Number(maxEdad || 0) > 0 &&
      Date.now() -
        Number(cache.fecha) >
        Number(maxEdad)
    ) {

      return null;

    }


    return cache.datos;

  }
  catch (error) {

    return null;

  }

}



function pintarDatosInicioV3_(
  datos
) {

  datos =
    datos || {};


  document
    .getElementById(
      "cargando"
    )
    .style.display =
      "none";


  const imagen =
    document.getElementById(
      "imagenAviso"
    );


  if (
    datos.urlAviso
  ) {

    imagen.onload =
      function() {

        imagen.style.display =
          "block";


        document
          .getElementById(
            "sinAviso"
          )
          .style.display =
            "none";

      };


    imagen.onerror =
      function() {

        mostrarSinAviso();

      };


    if (
      imagen.src !==
      datos.urlAviso
    ) {

      imagen.src =
        datos.urlAviso;

    }

  }
  else {

    mostrarSinAviso();

  }


  const boton =
    document.getElementById(
      "btnAcceder"
    );


  const estado =
    document.getElementById(
      "estadoSistema"
    );


  if (
    datos.sistemaActivo === false
  ) {

    boton.style.display =
      "none";


    estado.style.display =
      "block";

  }
  else {

    boton.style.display =
      "";


    estado.style.display =
      "none";

  }

}



document.addEventListener(
  "DOMContentLoaded",
  function() {

    cargarDatos();
    registrarServiceWorker();

  }
);


function registrarServiceWorker() {

  if (
    !("serviceWorker" in navigator)
  ) {

    return;

  }


  navigator.serviceWorker
    .register(
      "./service-worker.js",
      {
        scope:
          "./"
      }
    )
    .catch(
      function(error) {

        console.error(
          "No fue posible registrar el Service Worker:",
          error
        );

      }
    );

}


function cargarDatos() {

  /*
   * Primero usamos lo ya guardado para que la portada aparezca
   * inmediatamente. Después consultamos el servidor en segundo plano.
   */
  const cache =
    leerCacheDatosPublicosV3_(
      MAX_EDAD_CACHE_INICIO_MS
    );


  if (
    cache
  ) {

    pintarDatosInicioV3_(
      cache
    );

  }


  const script =
    document.createElement(
      "script"
    );


  script.src =
    URL_BACKEND +
    "?api=inicio" +
    "&callback=recibirDatosInicio" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      if (
        !cache
      ) {

        mostrarSinAviso();

      }

    };


  document.body.appendChild(
    script
  );

}


function recibirDatosInicio(
  resultado
) {

  if (
    !resultado ||
    !resultado.ok
  ) {

    const cache =
      leerCacheDatosPublicosV3_(
        MAX_EDAD_CACHE_INICIO_MS
      );


    if (
      !cache
    ) {

      mostrarSinAviso();

    }


    return;

  }


  const datos =
    resultado.datos || {};


  guardarCacheDatosPublicosV3_(
    datos
  );


  pintarDatosInicioV3_(
    datos
  );

}


function mostrarSinAviso() {

  document
    .getElementById(
      "cargando"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "imagenAviso"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "sinAviso"
    )
    .style.display =
      "block";

}


function irLogin() {

  window.location.href =
    "login.html";

}


</script>


</body>

</html>
