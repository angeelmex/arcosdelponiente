<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #204d5d;
    }

    .pagina {
      min-height: 100vh;
      padding: 16px 14px 28px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .encabezado {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .volver {
      width: 54px;
      min-width: 54px;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: white;
      color: #204d5d;
      font-size: 27px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(20,55,95,.09);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .titulo {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .subtitulo {
      margin-top: 4px;
      font-size: 13px;
      color: #718198;
    }

    .tarjeta {
      background: white;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 7px 24px rgba(20,55,95,.10);
    }

    .tipo-acceso {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 18px;
    }

    .tipo-btn {
      min-height: 64px;
      border: 2px solid #dce5ec;
      border-radius: 17px;
      background: white;
      color: #64768c;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .tipo-btn.activo {
      background: #204d5d;
      border-color: #204d5d;
      color: white;
    }

    .vigencia {
      margin-bottom: 17px;
      padding: 13px 14px;
      border-radius: 14px;
      background: #eef5f7;
      font-size: 13px;
      line-height: 1.45;
    }

    .grupo {
      margin-bottom: 16px;
    }

    .etiqueta {
      display: block;
      margin: 0 0 7px 2px;
      font-size: 14px;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      height: 62px;
      border: 2px solid #dce5ec;
      border-radius: 16px;
      padding: 0 16px;
      background: white;
      color: #20384f;
      font-size: 17px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #b7d52b;
    }

    .ayuda {
      margin: 6px 2px 0;
      font-size: 12px;
      color: #748399;
      line-height: 1.4;
    }

    .boton-principal {
      width: 100%;
      min-height: 66px;
      border: none;
      border-radius: 18px;
      background: #204d5d;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .boton-principal:disabled {
      opacity: .55;
    }

    .mensaje {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
    }

    .mensaje.error {
      display: block;
      background: #fdecec;
      color: #9e2929;
    }

    .resultado {
      display: none;
      background: white;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 7px 24px rgba(20,55,95,.10);
      text-align: center;
    }

    .correcto-icono {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eaf6ee;
      font-size: 31px;
    }

    .resultado h2 {
      margin: 0 0 7px;
      font-size: 23px;
    }

    .resultado-info {
      margin-bottom: 15px;
      color: #6e7f95;
      font-size: 14px;
      line-height: 1.55;
    }

    .qr {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 10px;
    }

    .folio {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .estado-compartir {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 13px;
      background: #eef5f7;
      color: #68798e;
      font-size: 13px;
      line-height: 1.4;
    }

    .compartir {
      width: 100%;
      min-height: 60px;
      border: none;
      border-radius: 17px;
      background: #238c45;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .compartir:disabled {
      opacity: .55;
      cursor: default;
    }

    .otro {
      width: 100%;
      min-height: 56px;
      border: none;
      border-radius: 16px;
      background: #edf3f6;
      color: #204d5d;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    #canvasPase {
      display: none;
    }

  </style>

  <title>Crear pase</title>

  <script defer src="./conexion-residente.js?v=20260828-1"></script>

</head>


<body>

<div class="pagina">

  <div class="contenedor">

    <div class="encabezado">

      <a
        class="volver"
        href="menu.html"
        aria-label="Volver al menú"
      >
        ←
      </a>

      <div>

        <h1
          id="titulo"
          class="titulo"
        >
          Crear pase
        </h1>

        <div
          id="subtitulo"
          class="subtitulo"
        ></div>

      </div>

    </div>



    <div
      id="formulario"
      class="tarjeta"
    >


      <div class="tipo-acceso">

        <button
          id="btnVehicular"
          type="button"
          class="tipo-btn activo"
          onclick="seleccionarAcceso('VEHICULAR')"
        >
          🚗 VEHICULAR
        </button>

        <button
          id="btnPeatonal"
          type="button"
          class="tipo-btn"
          onclick="seleccionarAcceso('PEATONAL')"
        >
          🚶 PEATONAL
        </button>

      </div>



      <div
        id="vigencia"
        class="vigencia"
      ></div>



      <div class="grupo">

        <label class="etiqueta">
          Nombre del visitante
        </label>

        <input
          id="nombreVisitante"
          type="text"
          maxlength="80"
          placeholder="Ej. Juan Pérez"
        >

      </div>



      <div class="grupo">

        <label class="etiqueta">
          Tipo de visita
        </label>

        <select id="tipoVisita">

          <option value="">
            Selecciona una opción
          </option>

          <option value="FAMILIAR">
            Familiar
          </option>

          <option value="UBER / DIDI">
            Uber / Didi
          </option>

          <option value="PAQUETERIA">
            Paquetería
          </option>

          <option value="SERVICIO">
            Servicio
          </option>

          <option value="PROVEEDOR">
            Proveedor
          </option>

          <option value="OTRO">
            Otro
          </option>

        </select>

      </div>



      <div
        id="grupoPlacas"
        class="grupo"
      >

        <label class="etiqueta">
          Placas del vehículo
        </label>

        <input
          id="placas"
          type="text"
          maxlength="12"
          placeholder="Ej. ABC123A"
          autocomplete="off"
          autocapitalize="characters"
          oninput="normalizarPlacasCampo(this)"
        >

        <div class="ayuda">
          Solo letras y números.
          Sin espacios ni guiones.
        </div>

      </div>



      <button
        id="btnCrear"
        type="button"
        class="boton-principal"
        onclick="crearPaseCliente()"
      >
        CREAR PASE
      </button>


      <div
        id="mensaje"
        class="mensaje"
      ></div>


    </div>



    <div
      id="resultado"
      class="resultado"
    >


      <div class="correcto-icono">
        ✓
      </div>


      <h2>
        Pase creado
      </h2>


      <div
        id="resultadoInfo"
        class="resultado-info"
      ></div>


      <img
        id="imagenQr"
        class="qr"
        alt="Código QR"
      >


      <div
        id="folio"
        class="folio"
      ></div>


      <div
        id="estadoCompartir"
        class="estado-compartir"
      >
        Preparando imagen para compartir...
      </div>


      <button
        id="btnCompartir"
        type="button"
        class="compartir"
        onclick="compartirPasePreparado()"
        disabled
      >
        PREPARANDO PASE...
      </button>


      <button
        type="button"
        class="otro"
        onclick="crearOtro()"
      >
        CREAR OTRO PASE
      </button>


    </div>


  </div>

</div>




<form
  id="formOperacionPase"
  method="post"
  action="https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec"
  target="iframeOperacionPase"
  style="display:none;"
>

  <input type="hidden" id="opAccion" name="accion">
  <input type="hidden" id="opToken" name="token">
  <input type="hidden" id="opRequestId" name="requestId">

  <input type="hidden" id="opTipoPase" name="tipoPase">
  <input type="hidden" id="opTipoAcceso" name="tipoAcceso">
  <input type="hidden" id="opNombreVisitante" name="nombreVisitante">
  <input type="hidden" id="opTipoVisita" name="tipoVisita">
  <input type="hidden" id="opPlacas" name="placas">
  <input type="hidden" id="opIdPase" name="idPase">

</form>


<iframe
  id="iframeOperacionPase"
  name="iframeOperacionPase"
  style="display:none;width:0;height:0;border:0;"
  title="Procesando pase"
></iframe>


<canvas
  id="canvasPase"
  width="1080"
  height="1350"
></canvas>

document.addEventListener(
  "DOMContentLoaded",
  iniciarVista
);



function iniciarVista() {

  TOKEN =
    sessionStorage.getItem(
      "tokenResidente"
    ) || "";


  if (
    !TOKEN
  ) {

    window.location.href =
      "login.html";

    return;

  }


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const tipoSolicitado =
    String(
      parametros.get(
        "tipo"
      ) || ""
    )
      .trim()
      .toUpperCase();


  TIPO_PASE =
    tipoSolicitado ===
      "PERMANENTE"
        ? "PERMANENTE"
        : "TEMPORAL";


  if (
    TIPO_PASE ===
    "PERMANENTE"
  ) {

    document
      .getElementById(
        "titulo"
      )
      .textContent =
        "Crear QR fijo";


    document
      .getElementById(
        "subtitulo"
      )
      .textContent =
        "Pase de acceso permanente";


    document
      .getElementById(
        "vigencia"
      )
      .textContent =
        "Este pase seguirá activo hasta que tú lo canceles.";


    document
      .getElementById(
        "btnCrear"
      )
      .textContent =
        "CREAR PASE PERMANENTE";

  }
  else {

    document
      .getElementById(
        "titulo"
      )
      .textContent =
        "Crear QR";


    document
      .getElementById(
        "subtitulo"
      )
      .textContent =
        "Pase temporal";


    document
      .getElementById(
        "vigencia"
      )
      .textContent =
        "Este QR puede utilizarse una sola vez. Si no se utiliza, vence automáticamente después de 12 horas.";

  }

}



/*************************************************
 * VEHICULAR / PEATONAL
 *************************************************/

function seleccionarAcceso(
  tipo
) {

  tipoAcceso =
    tipo;


  const vehicular =
    document.getElementById(
      "btnVehicular"
    );


  const peatonal =
    document.getElementById(
      "btnPeatonal"
    );


  const grupoPlacas =
    document.getElementById(
      "grupoPlacas"
    );


  if (
    tipo ===
    "VEHICULAR"
  ) {

    vehicular
      .classList
      .add(
        "activo"
      );


    peatonal
      .classList
      .remove(
        "activo"
      );


    grupoPlacas.style.display =
      "block";

  }
  else {

    peatonal
      .classList
      .add(
        "activo"
      );


    vehicular
      .classList
      .remove(
        "activo"
      );


    grupoPlacas.style.display =
      "none";


    document
      .getElementById(
        "placas"
      )
      .value =
        "";

  }

}



/*************************************************
 * PLACAS
 *************************************************/

function normalizarPlacasCampo(
  campo
) {

  campo.value =
    campo.value
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );

}



/*************************************************
 * CREAR PASE
 *************************************************/

function crearPaseCliente() {

  ocultarMensaje();


  const nombreVisitante =
    document
      .getElementById(
        "nombreVisitante"
      )
      .value
      .trim();


  const tipoVisita =
    document
      .getElementById(
        "tipoVisita"
      )
      .value;


  const placas =
    document
      .getElementById(
        "placas"
      )
      .value
      .trim();


  if (!nombreVisitante) {

    mostrarError(
      "Ingresa el nombre del visitante."
    );

    return;

  }


  if (!tipoVisita) {

    mostrarError(
      "Selecciona el tipo de visita."
    );

    return;

  }


  if (
    tipoAcceso ===
      "VEHICULAR" &&
    !placas
  ) {

    mostrarError(
      "Ingresa las placas del vehículo."
    );

    return;

  }


  const boton =
    document.getElementById(
      "btnCrear"
    );


  boton.disabled =
    true;


  boton.textContent =
    "CREANDO PASE...";


  ejecutarOperacionPaseV3(
    "crearPase",
    {
      tipoPase:
        TIPO_PASE,

      tipoAcceso:
        tipoAcceso,

      nombreVisitante:
        nombreVisitante,

      tipoVisita:
        tipoVisita,

      placas:
        placas
    },

    function(resultado) {

      if (
        !resultado ||
        !resultado.ok
      ) {

        mostrarError(
          resultado &&
          resultado.mensaje
            ? resultado.mensaje
            : "No fue posible crear el pase."
        );


        restaurarBoton();

        return;

      }


      paseCreado =
        resultado.datos;


      mostrarResultado();


      prepararImagenCompartible();

    },

    function() {

      mostrarError(
        "Ocurrió un problema al crear el pase."
      );


      restaurarBoton();

    }
  );

}



/*************************************************
 * RESULTADO
 *************************************************/

function mostrarResultado() {


  document
    .getElementById(
      "formulario"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "resultado"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "imagenQr"
    )
    .src =
      paseCreado.imagenQr;


  document
    .getElementById(
      "folio"
    )
    .textContent =
      "FOLIO: " +
      paseCreado.idPase;


  let informacion =
    "<strong>" +
    escaparHtml(
      paseCreado.nombreVisitante
    ) +
    "</strong>";


  informacion +=
    "<br>" +
    escaparHtml(
      paseCreado.tipoVisita
    );


  if (
    paseCreado.placas
  ) {

    informacion +=
      "<br>Placas: <strong>" +
      escaparHtml(
        paseCreado.placas
      ) +
      "</strong>";

  }


  if (
    paseCreado.tipoPase ===
    "TEMPORAL"
  ) {

    informacion +=
      "<br>Válido hasta: " +
      escaparHtml(
        paseCreado.fechaExpiracion
      );

  }
  else {

    informacion +=
      "<br>Pase permanente";

  }


  document
    .getElementById(
      "resultadoInfo"
    )
    .innerHTML =
      informacion;


  document
    .getElementById(
      "estadoCompartir"
    )
    .textContent =
      "Preparando imagen para compartir...";


  const botonCompartir =
    document.getElementById(
      "btnCompartir"
    );


  botonCompartir.disabled =
    true;


  botonCompartir.textContent =
    "PREPARANDO PASE...";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/*************************************************
 * PREPARAR IMAGEN
 *************************************************/

function prepararImagenCompartible() {

  archivoPaseCompartible =
    null;


  blobPaseCompartible =
    null;


  ejecutarOperacionPaseV3(
    "qrCompartir",
    {
      idPase:
        paseCreado.idPase
    },

    function(resultado) {

      if (
        !resultado ||
        !resultado.ok
      ) {

        marcarErrorCompartir(
          resultado &&
          resultado.mensaje
            ? resultado.mensaje
            : "No fue posible preparar la imagen."
        );

        return;

      }


      generarTarjetaPng(
        resultado.datos.dataUrl
      );

    },

    function() {

      marcarErrorCompartir(
        "No fue posible preparar la imagen."
      );

    }
  );

}



/*************************************************
 * TARJETA PNG
 *************************************************/

function generarTarjetaPng(
  dataUrlQr
) {


  const imagenQr =
    new Image();


  imagenQr.onload =
    function() {


      const logoArcos =
        new Image();


      logoArcos.onload =
        function() {


          try {


            const canvas =
              document.getElementById(
                "canvasPase"
              );


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.clearRect(
              0,
              0,
              1080,
              1350
            );


            /*********************************************
             * FONDO GENERAL
             *********************************************/

            ctx.fillStyle =
              "#F4F7FB";


            ctx.fillRect(
              0,
              0,
              1080,
              1350
            );


            /*********************************************
             * TARJETA PRINCIPAL
             *********************************************/

            ctx.fillStyle =
              "#FFFFFF";


            redondearRectangulo(
              ctx,
              55,
              45,
              970,
              1260,
              48
            );


            ctx.fill();


            /*********************************************
             * ENCABEZADO
             *********************************************/

            ctx.fillStyle =
              "#204D5D";


            redondearRectangulo(
              ctx,
              55,
              45,
              970,
              210,
              48
            );


            ctx.fill();


            ctx.fillRect(
              55,
              155,
              970,
              100
            );


            /*********************************************
             * LOGO REAL SUPERIOR
             *********************************************/

            dibujarLogoArcosImagen(
              ctx,
              logoArcos,
              540,
              105,
              115,
              92
            );


            ctx.fillStyle =
              "#FFFFFF";


            ctx.font =
              "bold 43px Arial";


            ctx.textAlign =
              "center";


            ctx.fillText(
              "ARCOS DEL PONIENTE",
              540,
              190
            );


            /*********************************************
             * TIPO DE PASE
             *********************************************/

            ctx.fillStyle =
              "#204D5D";


            ctx.font =
              "bold 34px Arial";


            ctx.fillText(
              paseCreado.tipoPase ===
                "PERMANENTE"
                  ? "PASE DE ACCESO PERMANENTE"
                  : "PASE DE ACCESO",
              540,
              310
            );


            /*********************************************
             * NOMBRE DEL VISITANTE
             *********************************************/

            ctx.font =
              "bold 38px Arial";


            dibujarTextoCentradoLimitado(
              ctx,
              paseCreado.nombreVisitante,
              540,
              365,
              820
            );


            /*********************************************
             * MARCO DEL QR
             *********************************************/

            ctx.fillStyle =
              "#F7FAFC";


            redondearRectangulo(
              ctx,
              185,
              410,
              710,
              650,
              34
            );


            ctx.fill();


            ctx.strokeStyle =
              "#DDE7ED";


            ctx.lineWidth =
              3;


            redondearRectangulo(
              ctx,
              185,
              410,
              710,
              650,
              34
            );


            ctx.stroke();


            /*********************************************
             * QR
             *********************************************/

            ctx.drawImage(
              imagenQr,
              245,
              455,
              590,
              590
            );


            /*********************************************
             * LOGO REAL EN EL CENTRO DEL QR
             *********************************************/

            ctx.fillStyle =
              "#FFFFFF";


            redondearRectangulo(
              ctx,
              467,
              683,
              146,
              134,
              26
            );


            ctx.fill();


            dibujarLogoArcosImagen(
              ctx,
              logoArcos,
              540,
              750,
              112,
              96
            );


            /*********************************************
             * FOLIO
             *********************************************/

            ctx.fillStyle =
              "#204D5D";


            ctx.font =
              "bold 34px Arial";


            ctx.textAlign =
              "center";


            ctx.fillText(
              "FOLIO " +
              paseCreado.idPase,
              540,
              1110
            );


            /*********************************************
             * DATOS
             *********************************************/

            ctx.textAlign =
              "left";


            ctx.fillStyle =
              "#718198";


            ctx.font =
              "bold 27px Arial";


            ctx.fillText(
              "TIPO",
              145,
              1172
            );


            ctx.fillText(
              "ACCESO",
              450,
              1172
            );


            if (
              paseCreado.placas
            ) {

              ctx.fillText(
                "PLACAS",
                760,
                1172
              );

            }


            ctx.fillStyle =
              "#204D5D";


            ctx.font =
              "bold 29px Arial";


            ctx.fillText(
              paseCreado.tipoVisita,
              145,
              1212
            );


            ctx.fillText(
              paseCreado.tipoAcceso,
              450,
              1212
            );


            if (
              paseCreado.placas
            ) {

              ctx.fillText(
                paseCreado.placas,
                760,
                1212
              );

            }


            /*********************************************
             * VIGENCIA
             *********************************************/

            ctx.textAlign =
              "center";


            ctx.fillStyle =
              "#68798E";


            ctx.font =
              "24px Arial";


            if (
              paseCreado.tipoPase ===
              "TEMPORAL"
            ) {

              ctx.fillText(
                "Válido para un solo ingreso · Expira " +
                paseCreado.fechaExpiracion,
                540,
                1270
              );

            }
            else {

              ctx.fillText(
                "Pase permanente · Activo hasta que el residente lo cancele",
                540,
                1270
              );

            }


            /*********************************************
             * CREAR ARCHIVO PNG
             *********************************************/

            canvas.toBlob(
              function(blob) {


                if (!blob) {

                  marcarErrorCompartir(
                    "No fue posible crear la imagen."
                  );

                  return;

                }


                blobPaseCompartible =
                  blob;


                archivoPaseCompartible =
                  new File(
                    [blob],
                    "Pase_" +
                    paseCreado.idPase +
                    ".png",
                    {
                      type:
                        "image/png"
                    }
                  );


                marcarCompartirListo();

              },
              "image/png",
              1
            );


          }
          catch (error) {

            console.error(
              error
            );


            marcarErrorCompartir(
              "No fue posible crear la imagen."
            );

          }

        };


      logoArcos.onerror =
        function() {

          marcarErrorCompartir(
            "No fue posible cargar el logo de la colonia."
          );

        };


      logoArcos.src =
        LOGO_ARCOS_DATA_URL;

    };


  imagenQr.onerror =
    function() {

      marcarErrorCompartir(
        "No fue posible cargar el QR para compartir."
      );

    };


  imagenQr.src =
    dataUrlQr;

}



/*************************************************
 * COMPARTIR
 *************************************************/

function marcarCompartirListo() {


  document
    .getElementById(
      "estadoCompartir"
    )
    .textContent =
      "Tu pase está listo para compartir.";


  const boton =
    document.getElementById(
      "btnCompartir"
    );


  boton.disabled =
    false;


  boton.textContent =
    "📤 COMPARTIR PASE";

}



function marcarErrorCompartir(
  mensaje
) {


  document
    .getElementById(
      "estadoCompartir"
    )
    .textContent =
      mensaje;


  const boton =
    document.getElementById(
      "btnCompartir"
    );


  if (
    blobPaseCompartible
  ) {

    boton.disabled =
      false;


    boton.textContent =
      "GUARDAR IMAGEN";

  }
  else {

    boton.disabled =
      true;


    boton.textContent =
      "NO DISPONIBLE";

  }

}



async function compartirPasePreparado() {


  if (
    !archivoPaseCompartible
  ) {

    if (
      blobPaseCompartible
    ) {

      descargarImagen(
        blobPaseCompartible
      );

    }

    return;

  }


  try {


    const puedeCompartirArchivo =
      navigator.share &&
      (
        !navigator.canShare ||
        navigator.canShare({
          files:
            [archivoPaseCompartible]
        })
      );


    if (
      puedeCompartirArchivo
    ) {

      await navigator.share({

        files:
          [archivoPaseCompartible],

        title:
          "Pase de acceso",

        text:
          "Pase de acceso a Arcos del Poniente"

      });


      return;

    }


    descargarImagen(
      blobPaseCompartible
    );


    alert(
      "Este navegador no permite adjuntar la imagen directamente. Se guardó el pase para que puedas enviarlo por WhatsApp."
    );


  }
  catch (error) {


    if (
      error &&
      error.name ===
      "AbortError"
    ) {

      return;

    }


    console.error(
      error
    );


    descargarImagen(
      blobPaseCompartible
    );


    alert(
      "No fue posible abrir el menú de compartir. Se guardó la imagen para que puedas enviarla manualmente."
    );

  }

}



/*************************************************
 * GUARDAR IMAGEN
 *************************************************/

function descargarImagen(
  blob
) {


  if (!blob) {

    return;

  }


  const url =
    URL.createObjectURL(
      blob
    );


  const enlace =
    document.createElement(
      "a"
    );


  enlace.href =
    url;


  enlace.download =
    "Pase_" +
    paseCreado.idPase +
    ".png";


  document.body.appendChild(
    enlace
  );


  enlace.click();


  enlace.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1500
  );

}



/*************************************************
 * UTILIDADES CANVAS
 *************************************************/

function redondearRectangulo(
  ctx,
  x,
  y,
  ancho,
  alto,
  radio
) {


  ctx.beginPath();


  ctx.moveTo(
    x + radio,
    y
  );


  ctx.lineTo(
    x + ancho - radio,
    y
  );


  ctx.quadraticCurveTo(
    x + ancho,
    y,
    x + ancho,
    y + radio
  );


  ctx.lineTo(
    x + ancho,
    y + alto - radio
  );


  ctx.quadraticCurveTo(
    x + ancho,
    y + alto,
    x + ancho - radio,
    y + alto
  );


  ctx.lineTo(
    x + radio,
    y + alto
  );


  ctx.quadraticCurveTo(
    x,
    y + alto,
    x,
    y + alto - radio
  );


  ctx.lineTo(
    x,
    y + radio
  );


  ctx.quadraticCurveTo(
    x,
    y,
    x + radio,
    y
  );


  ctx.closePath();

}



function dibujarTextoLimitado(
  ctx,
  valorTexto,
  x,
  y,
  anchoMaximo
) {


  const original =
    String(
      valorTexto || ""
    );


  let valor =
    original;


  while (
    ctx.measureText(
      valor
    ).width >
      anchoMaximo &&
    valor.length > 3
  ) {

    valor =
      valor.substring(
        0,
        valor.length - 1
      );

  }


  if (
    valor !==
    original
  ) {

    valor +=
      "…";

  }


  ctx.fillText(
    valor,
    x,
    y
  );

}



/*************************************************
 * LOGO REAL DE ARCOS PARA CANVAS
 *************************************************/

function dibujarLogoArcosImagen(
  ctx,
  imagen,
  centroX,
  centroY,
  anchoMaximo,
  altoMaximo
) {

  const proporcion =
    imagen.width /
    imagen.height;


  let ancho =
    anchoMaximo;


  let alto =
    ancho /
    proporcion;


  if (
    alto >
    altoMaximo
  ) {

    alto =
      altoMaximo;


    ancho =
      alto *
      proporcion;

  }


  ctx.drawImage(
    imagen,
    centroX -
      (ancho / 2),
    centroY -
      (alto / 2),
    ancho,
    alto
  );

}



/*************************************************
 * TEXTO CENTRADO LIMITADO
 *************************************************/

function dibujarTextoCentradoLimitado(
  ctx,
  valorTexto,
  centroX,
  y,
  anchoMaximo
) {

  const original =
    String(
      valorTexto || ""
    );


  let valor =
    original;


  while (
    ctx.measureText(
      valor
    ).width >
      anchoMaximo &&
    valor.length > 3
  ) {

    valor =
      valor.substring(
        0,
        valor.length - 1
      );

  }


  if (
    valor !==
    original
  ) {

    valor +=
      "…";

  }


  ctx.textAlign =
    "center";


  ctx.fillText(
    valor,
    centroX,
    y
  );

}



/*************************************************
 * MOTOR DE OPERACIONES EXTERNAS V3
 *************************************************/

let OPERACION_PASE =
  null;


const MAX_CONSULTAS_PASE =
  35;


function ejecutarOperacionPaseV3(
  accion,
  datos,
  alTerminar,
  alFallar
) {

  if (
    OPERACION_PASE
  ) {

    if (
      typeof alFallar ===
        "function"
    ) {

      alFallar();

    }

    return;

  }


  const requestId =
    generarRequestIdPaseV3();


  OPERACION_PASE = {
    requestId:
      requestId,

    alTerminar:
      alTerminar,

    alFallar:
      alFallar,

    consultas:
      0
  };


  document
    .getElementById(
      "opAccion"
    )
    .value =
      accion;


  document
    .getElementById(
      "opToken"
    )
    .value =
      TOKEN;


  document
    .getElementById(
      "opRequestId"
    )
    .value =
      requestId;


  document
    .getElementById(
      "opTipoPase"
    )
    .value =
      datos &&
      datos.tipoPase
        ? datos.tipoPase
        : "";


  document
    .getElementById(
      "opTipoAcceso"
    )
    .value =
      datos &&
      datos.tipoAcceso
        ? datos.tipoAcceso
        : "";


  document
    .getElementById(
      "opNombreVisitante"
    )
    .value =
      datos &&
      datos.nombreVisitante
        ? datos.nombreVisitante
        : "";


  document
    .getElementById(
      "opTipoVisita"
    )
    .value =
      datos &&
      datos.tipoVisita
        ? datos.tipoVisita
        : "";


  document
    .getElementById(
      "opPlacas"
    )
    .value =
      datos &&
      datos.placas
        ? datos.placas
        : "";


  document
    .getElementById(
      "opIdPase"
    )
    .value =
      datos &&
      datos.idPase
        ? datos.idPase
        : "";


  document
    .getElementById(
      "formOperacionPase"
    )
    .submit();


  setTimeout(
    consultarEstadoOperacionPaseV3,
    700
  );

}


function consultarEstadoOperacionPaseV3() {

  if (
    !OPERACION_PASE
  ) {

    return;

  }


  OPERACION_PASE.consultas++;


  if (
    OPERACION_PASE.consultas >
      MAX_CONSULTAS_PASE
  ) {

    terminarOperacionPaseConError();

    return;

  }


  window.recibirEstadoPaseV3 =
    function(resultado) {

      procesarEstadoOperacionPaseV3(
        resultado
      );

    };


  const anterior =
    document.getElementById(
      "consultaPaseV3"
    );


  if (
    anterior
  ) {

    anterior.remove();

  }


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "consultaPaseV3";


  script.src =
    URL_BACKEND +
    "?api=operacionEstado" +
    "&requestId=" +
    encodeURIComponent(
      OPERACION_PASE.requestId
    ) +
    "&callback=recibirEstadoPaseV3" +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      script.remove();


      if (
        OPERACION_PASE
      ) {

        setTimeout(
          consultarEstadoOperacionPaseV3,
          700
        );

      }

    };


  document.body.appendChild(
    script
  );

}


function procesarEstadoOperacionPaseV3(
  resultado
) {

  const script =
    document.getElementById(
      "consultaPaseV3"
    );


  if (
    script
  ) {

    script.remove();

  }


  if (
    !OPERACION_PASE
  ) {

    return;

  }


  if (
    !resultado ||
    !resultado.ok
  ) {

    terminarOperacionPaseConError();

    return;

  }


  const datos =
    resultado.datos || {};


  if (
    datos.estado ===
      "PENDIENTE"
  ) {

    setTimeout(
      consultarEstadoOperacionPaseV3,
      700
    );

    return;

  }


  if (
    datos.estado !==
      "LISTO" ||
    !datos.resultado
  ) {

    terminarOperacionPaseConError();

    return;

  }


  const operacion =
    OPERACION_PASE;


  OPERACION_PASE =
    null;


  if (
    typeof operacion.alTerminar ===
      "function"
  ) {

    operacion.alTerminar(
      datos.resultado
    );

  }

}


function terminarOperacionPaseConError() {

  if (
    !OPERACION_PASE
  ) {

    return;

  }


  const operacion =
    OPERACION_PASE;


  OPERACION_PASE =
    null;


  if (
    typeof operacion.alFallar ===
      "function"
  ) {

    operacion.alFallar();

  }

}


function generarRequestIdPaseV3() {

  if (
    window.crypto &&
    typeof crypto.randomUUID ===
      "function"
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

    )

    .getElementById(

    )

) {

      "nearest"
  });

    );

    "mensaje";


  mensaje.textContent =

/*************************************************
 * TEXTO SEGURO
 *************************************************/

function escaparHtml(
  valor
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    valor || "";


  return div.innerHTML;

}
