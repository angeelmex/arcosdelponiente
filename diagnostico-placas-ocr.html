<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f4f7fb">
  <title>Diagnóstico OCR Placas</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#204d5d}
    .pagina{min-height:100vh;padding:22px 14px 34px}
    .contenedor{max-width:560px;margin:0 auto}
    h1{margin:0 0 6px;font-size:30px;line-height:1.1}
    .sub{color:#718198;margin:0 0 18px;font-size:16px;line-height:1.45}
    .panel{background:white;border-radius:24px;padding:22px 18px 24px;box-shadow:0 7px 24px rgba(20,55,95,.10)}
    .aviso{padding:14px;border-radius:15px;background:#fff8e5;color:#705b22;font-size:14px;line-height:1.45;margin-bottom:18px}
    .grupo{margin-bottom:18px}
    label.titulo{display:block;margin:0 0 8px;font-size:16px;font-weight:900}
    .foto-input{display:none}
    .foto-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;padding:13px;border:2px solid #204d5d;border-radius:17px;background:white;color:#204d5d;font-size:17px;font-weight:900;text-align:center;cursor:pointer}
    .foto-btn.lista{background:#edf7ef;border-color:#238c45;color:#267245}
    .preview{display:none;margin-top:10px;overflow:hidden;border-radius:14px;background:#eef3f7}
    .preview img{display:block;width:100%;max-height:260px;object-fit:contain}
    .principal{width:100%;min-height:64px;border:none;border-radius:18px;background:#238c45;color:white;font-size:20px;font-weight:900}
    .principal:disabled{opacity:.6}
    .resultado{display:none;margin-top:18px}
    .tarjeta{border:2px solid #d9e3e9;border-radius:17px;padding:15px;margin-top:12px}
    .etiqueta{font-size:12px;font-weight:900;color:#758799;margin-bottom:6px;text-transform:uppercase}
    .valor{font-size:21px;font-weight:900;color:#204d5d;word-break:break-word}
    .texto-ocr{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#40586a;max-height:300px;overflow:auto}
    .estado{display:none;margin-top:14px;padding:13px;border-radius:13px;background:#edf3f6;color:#496576;font-weight:800;text-align:center}
    .overlay{display:none;position:fixed;inset:0;background:rgba(20,40,55,.48);align-items:center;justify-content:center;padding:20px;z-index:9999}
    .overlay.visible{display:flex}
    .modal{width:100%;max-width:390px;background:white;border-radius:22px;padding:22px 20px 18px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.22)}
    .icono{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;background:#fdecec;color:#9c3030}
    .modal h2{margin:0 0 8px;font-size:21px}
    .modal p{margin:0;color:#5f7082;font-size:15px;line-height:1.5}
    .modal button{width:100%;min-height:50px;margin-top:16px;border:none;border-radius:14px;background:#204d5d;color:white;font-size:16px;font-weight:900}
  </style>
</head>
<body>
<div class="pagina">
  <div class="contenedor">
    <h1>Diagnóstico OCR de placas</h1>
    <p class="sub">Esta página prueba únicamente el lector de placas que ya había funcionado.</p>

    <section class="panel">
      <div class="aviso">
        <strong>PRUEBA AISLADA:</strong> no registra acceso, no guarda en ACCESOS y no manda notificaciones.
      </div>

      <div class="grupo">
        <label class="titulo">Foto de placas</label>
        <input id="fotoPlacas" class="foto-input" type="file" accept="image/*" capture="environment" onchange="procesarFoto(this)">
        <label id="btnFoto" class="foto-btn" for="fotoPlacas">📷 TOMAR FOTO DE PLACAS</label>

        <div id="preview" class="preview">
          <img id="imgPreview" alt="Foto de placas">
        </div>
      </div>

      <button id="btnAnalizar" class="principal" type="button" onclick="analizarPlaca()">ANALIZAR PLACA</button>

      <div id="estado" class="estado">Analizando placa...</div>

      <div id="resultado" class="resultado">
        <div class="tarjeta">
          <div class="etiqueta">Placa sugerida</div>
          <div id="placaSugerida" class="valor">—</div>
        </div>

        <div class="tarjeta">
          <div class="etiqueta">Texto completo detectado por Google Vision</div>
          <div id="textoOCR" class="texto-ocr">—</div>
        </div>
      </div>
    </section>
  </div>
</div>

<div id="alertaOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="icono">!</div>
    <h2>Atención</h2>
    <p id="alertaTexto"></p>
    <button type="button" onclick="cerrarAlerta()">ENTENDIDO</button>
  </div>
</div>

<form id="formApi" method="post"
  action="https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec"
  target="frameApi" style="display:none;"></form>
<iframe id="frameApi" name="frameApi" style="display:none;width:0;height:0;border:0;" title="Procesando"></iframe>

<script>
const URL_BACKEND =
  "https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec";

let fotoPlacasBase64 = "";
let operacionActual = null;

async function procesarFoto(input) {
  const archivo = input.files && input.files[0];

  if (!archivo) return;

  try {
    const procesada = await comprimirImagen(archivo,1280,0.78);

    fotoPlacasBase64 = procesada.base64;

    document.getElementById("imgPreview").src =
      "data:image/jpeg;base64," + fotoPlacasBase64;

    document.getElementById("preview").style.display = "block";

    const botonFoto = document.getElementById("btnFoto");
    botonFoto.classList.add("lista");
    botonFoto.textContent = "✓ FOTO DE PLACAS LISTA";

    document.getElementById("resultado").style.display = "none";
  }
  catch (error) {
    fotoPlacasBase64 = "";
    mostrarAlerta("ERROR EN FOTO DE PLACAS");
  }
}

function comprimirImagen(archivo,maximo,calidad) {
  return new Promise(function(resolve,reject){
    const lector = new FileReader();

    lector.onerror = reject;

    lector.onload = function(){
      const imagen = new Image();

      imagen.onerror = reject;

      imagen.onload = function(){
        let ancho = imagen.width;
        let alto = imagen.height;

        const escala =
          Math.min(
            1,
            maximo / Math.max(ancho,alto)
          );

        ancho = Math.max(1,Math.round(ancho*escala));
        alto = Math.max(1,Math.round(alto*escala));

        const canvas = document.createElement("canvas");
        canvas.width = ancho;
        canvas.height = alto;

        canvas
          .getContext("2d")
          .drawImage(imagen,0,0,ancho,alto);

        const dataUrl =
          canvas.toDataURL(
            "image/jpeg",
            calidad
          );

        resolve({
          base64:dataUrl.split(",")[1]
        });
      };

      imagen.src = lector.result;
    };

    lector.readAsDataURL(archivo);
  });
}

function analizarPlaca() {
  if (operacionActual) return;

  if (!fotoPlacasBase64) {
    mostrarAlerta("ERROR EN FOTO DE PLACAS");
    return;
  }

  const boton = document.getElementById("btnAnalizar");
  boton.disabled = true;
  boton.textContent = "ANALIZANDO...";
  document.getElementById("estado").style.display = "block";
  document.getElementById("resultado").style.display = "none";

  /*
   * FLUJO HISTÓRICO QUE SÍ FUNCIONÓ:
   * acción: ocrPlacaPrueba
   * foto: imagenBase64
   */
  apiPost(
    "ocrPlacaPrueba",
    {
      imagenBase64:
        fotoPlacasBase64
    },
    function(resultado){
      boton.disabled = false;
      boton.textContent = "ANALIZAR PLACA";
      document.getElementById("estado").style.display = "none";

      if (!resultado || !resultado.ok) {
        mostrarAlerta(
          resultado && resultado.mensaje
            ? resultado.mensaje
            : "ERROR EN FOTO DE PLACAS"
        );
        return;
      }

      const datos =
        resultado.datos || resultado;

      const placa =
        datos.placaSugerida ||
        datos.placa ||
        datos.sugerencia ||
        "";

      const texto =
        datos.textoOCR ||
        datos.texto ||
        datos.textoCompleto ||
        "";

      document.getElementById("placaSugerida").textContent =
        placa || "NO SE GENERÓ PLACA SUGERIDA";

      document.getElementById("textoOCR").textContent =
        texto || "GOOGLE VISION NO DEVOLVIÓ TEXTO";

      document.getElementById("resultado").style.display = "block";
    }
  );
}

function apiPost(accion,parametros,exito) {
  const requestId = generarRequestId();

  operacionActual = {
    requestId:requestId,
    intentos:0
  };

  const form = document.getElementById("formApi");
  form.innerHTML = "";

  const datos =
    Object.assign(
      {},
      parametros || {},
      {
        accion:accion,
        requestId:requestId
      }
    );

  Object.keys(datos).forEach(function(nombre){
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = nombre;
    input.value =
      datos[nombre] == null
        ? ""
        : String(datos[nombre]);

    form.appendChild(input);
  });

  form.submit();

  setTimeout(function(){
    consultarResultado(exito);
  },650);
}

function consultarResultado(exito) {
  if (!operacionActual) return;

  operacionActual.intentos++;

  if (operacionActual.intentos > 100) {
    operacionActual = null;
    document.getElementById("btnAnalizar").disabled = false;
    document.getElementById("btnAnalizar").textContent = "ANALIZAR PLACA";
    document.getElementById("estado").style.display = "none";
    mostrarAlerta("EL SERVIDOR ESTÁ TARDANDO DEMASIADO");
    return;
  }

  const requestId =
    operacionActual.requestId;

  const callback =
    "ocrDiagCallback_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2);

  const script =
    document.createElement("script");

  window[callback] =
    function(resultado){

      try{script.remove();}catch(error){}
      try{delete window[callback];}catch(error){}

      if (!resultado || !resultado.ok) {
        operacionActual = null;
        exito(resultado);
        return;
      }

      const datos =
        resultado.datos || {};

      if (datos.estado === "PENDIENTE") {
        setTimeout(function(){
          consultarResultado(exito);
        },600);
        return;
      }

      operacionActual = null;

      if (datos.estado === "LISTO") {
        exito(datos.resultado);
      }
      else {
        exito({
          ok:false,
          mensaje:"No fue posible recuperar el resultado."
        });
      }
    };

  script.onerror =
    function(){
      try{script.remove();}catch(error){}
      try{delete window[callback];}catch(error){}

      setTimeout(function(){
        consultarResultado(exito);
      },800);
    };

  script.src =
    URL_BACKEND +
    "?api=operacionEstado" +
    "&requestId=" +
    encodeURIComponent(requestId) +
    "&callback=" +
    encodeURIComponent(callback) +
    "&t=" +
    Date.now();

  document.body.appendChild(script);
}

function generarRequestId() {
  if (
    window.crypto &&
    typeof crypto.randomUUID === "function"
  ) {
    return crypto.randomUUID().replace(/-/g,"");
  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2) +
    Math.random().toString(36).slice(2)
  );
}

function mostrarAlerta(texto) {
  document.getElementById("alertaTexto").textContent =
    texto || "ERROR EN FOTO DE PLACAS";

  document.getElementById("alertaOverlay").classList.add("visible");
}

function cerrarAlerta() {
  document.getElementById("alertaOverlay").classList.remove("visible");
}
</script>
</body>
</html>
