<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Avisos de Guardias</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#204d5d}.pagina{min-height:100vh;padding:16px 14px 30px}.contenedor{width:100%;max-width:540px;margin:0 auto}.encabezado{display:flex;align-items:center;gap:12px;margin-bottom:18px}.volver{width:54px;height:54px;border:none;border-radius:16px;background:#fff;color:#204d5d;font-size:27px;font-weight:bold;box-shadow:0 5px 16px rgba(20,55,95,.09)}.titulo{margin:0;font-size:24px;font-weight:800}.subtitulo{margin-top:4px;font-size:13px;color:#718198}.info{background:#fff;border-radius:20px;padding:15px 16px;margin-bottom:18px;box-shadow:0 5px 18px rgba(20,55,95,.08)}.info strong{display:block;margin-bottom:5px}.info span{font-size:13px;color:#718198;line-height:1.45}.lista{display:grid;gap:14px}.aviso{width:100%;min-height:92px;border:none;border-radius:22px;padding:18px;text-align:left;background:#fff;color:#204d5d;box-shadow:0 5px 18px rgba(20,55,95,.09);display:flex;align-items:center;gap:15px}.icono{width:58px;height:58px;border-radius:18px;background:#edf3f6;display:flex;align-items:center;justify-content:center;font-size:30px}.aviso-textos{flex:1}.aviso-titulo{font-size:18px;font-weight:800;margin-bottom:4px}.aviso-descripcion{font-size:13px;color:#718198;line-height:1.4}.flecha{font-size:24px;color:#9aa8b5}.nota{margin-top:18px;padding:13px 14px;border-radius:16px;background:#fff8e7;color:#8a6819;font-size:12px;line-height:1.45}.modal-fondo{display:none;position:fixed;inset:0;background:rgba(8,18,30,.74);align-items:center;justify-content:center;padding:18px}.modal{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:22px}.modal-icono{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;background:#edf3f6;display:flex;align-items:center;justify-content:center;font-size:36px}.modal h2,.modal p{text-align:center}.modal p{color:#718198;line-height:1.5}.botones{display:grid;gap:10px;margin-top:20px}.botones button{min-height:56px;border:none;border-radius:17px;font-size:16px;font-weight:800}.confirmar{background:#204d5d;color:#fff}.cancelar{background:#edf3f6;color:#204d5d}.mensaje{display:none;position:fixed;left:16px;right:16px;bottom:22px;max-width:500px;margin:0 auto;padding:15px;border-radius:15px;text-align:center;font-size:14px;font-weight:800;background:#e9f7ee;color:#267245}
  </style>
</head>
<body>
<div class="pagina"><div class="contenedor">
  <div class="encabezado"><button class="volver" onclick="volverGuardias()">←</button><div><h1 class="titulo">Avisos</h1><div class="subtitulo">Notificaciones rápidas para residentes</div></div></div>
  <div class="info"><strong>Selecciona un aviso</strong><span>Antes de enviarlo aparecerá una confirmación para evitar avisos accidentales.</span></div>
  <div class="lista">
    <button class="aviso" onclick="prepararAviso('BASURA')"><div class="icono">🚛</div><div class="aviso-textos"><div class="aviso-titulo">BASURA</div><div class="aviso-descripcion">Avisar que está entrando el camión recolector de basura.</div></div><div class="flecha">›</div></button>
    <button class="aviso" onclick="prepararAviso('RECORRIDO')"><div class="icono">🛡️</div><div class="aviso-textos"><div class="aviso-titulo">RECORRIDO</div><div class="aviso-descripcion">Avisar que los guardias están realizando recorrido por la colonia.</div></div><div class="flecha">›</div></button>
  </div>
  <div class="nota">Los avisos se envían a todos los residentes con notificaciones activas. Confirma únicamente cuando el evento esté ocurriendo.</div>
</div></div>
<div id="modal" class="modal-fondo"><div class="modal"><div id="mIcono" class="modal-icono">🔔</div><h2 id="mTitulo">Confirmar aviso</h2><p id="mTexto"></p><div class="botones"><button class="confirmar" onclick="confirmarAviso()">CONFIRMAR</button><button class="cancelar" onclick="cerrarModal()">CANCELAR</button></div></div></div>
<div id="mensaje" class="mensaje"></div>
<form id="formAvisosGuardias" method="post" action="https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec" target="iframeAvisosGuardias" style="display:none;">
  <input type="hidden" id="avisoAccion" name="accion">
  <input type="hidden" id="avisoRequestId" name="requestId">
  <input type="hidden" id="avisoClaveGuardias" name="claveGuardias">
  <input type="hidden" id="avisoTipo" name="tipoAviso">
</form>
<iframe id="iframeAvisosGuardias" name="iframeAvisosGuardias" style="display:none;width:0;height:0;border:0;" title="Procesando aviso"></iframe>
<script>
const URL_BACKEND="https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec";
const CLAVE_LOCAL_GUARDIAS="claveGuardiasArcosV3";

let avisoSeleccionado="";
let avisoEnviando=false;
let operacionAvisoGuardias=null;

const AVISOS={
  BASURA:{
    icono:"🚛",
    titulo:"BASURA",
    texto:"Se enviará a todos los residentes: “Se informa que el camión recolector de basura ha ingresado al fraccionamiento.”"
  },
  RECORRIDO:{
    icono:"🛡️",
    titulo:"RECORRIDO",
    texto:"Se enviará a todos los residentes: “Se informa que el personal de seguridad se encuentra realizando un recorrido por el fraccionamiento.”"
  }
};

function prepararAviso(tipo){
  if(avisoEnviando)return;
  const a=AVISOS[tipo];
  if(!a)return;
  avisoSeleccionado=tipo;
  document.getElementById("mIcono").textContent=a.icono;
  document.getElementById("mTitulo").textContent="Enviar aviso: "+a.titulo;
  document.getElementById("mTexto").textContent=a.texto;
  document.getElementById("modal").style.display="flex";
}

function cerrarModal(){
  avisoSeleccionado="";
  document.getElementById("modal").style.display="none";
}

function confirmarAviso(){
  if(!avisoSeleccionado||avisoEnviando)return;

  const tipoAviso=avisoSeleccionado;
  cerrarModal();

  const claveGuardias=localStorage.getItem(CLAVE_LOCAL_GUARDIAS)||"";

  if(!claveGuardias){
    mostrarError("Este dispositivo no está autorizado como guardia. Abre primero la app principal de guardias.");
    return;
  }

  avisoEnviando=true;
  mostrarMensaje("Enviando aviso...");

  const requestId=generarRequestId();
  operacionAvisoGuardias={requestId:requestId,intentos:0};

  document.getElementById("avisoAccion").value="guardiasAvisoEnviar";
  document.getElementById("avisoRequestId").value=requestId;
  document.getElementById("avisoClaveGuardias").value=claveGuardias;
  document.getElementById("avisoTipo").value=tipoAviso;

  document.getElementById("formAvisosGuardias").submit();

  setTimeout(consultarResultado,700);
}

function generarRequestId(){
  if(window.crypto&&typeof crypto.randomUUID==="function"){
    return crypto.randomUUID().replace(/-/g,"");
  }

  return Date.now().toString(36)+
    Math.random().toString(36).slice(2)+
    Math.random().toString(36).slice(2);
}

function consultarResultado(){
  if(!operacionAvisoGuardias)return;

  operacionAvisoGuardias.intentos++;

  if(operacionAvisoGuardias.intentos>50){
    avisoEnviando=false;
    operacionAvisoGuardias=null;
    mostrarError("El servidor está tardando más de lo normal. No vuelvas a enviar el aviso hasta verificar si ya llegó.");
    return;
  }

  const callback="cbAvisoGuardias_"+Date.now()+"_"+Math.floor(Math.random()*100000);

  window[callback]=function(resultado){
    try{delete window[callback]}catch(e){}

    const anterior=document.getElementById("consultaAvisoGuardias");
    if(anterior)anterior.remove();

    if(!resultado||!resultado.ok){
      avisoEnviando=false;
      operacionAvisoGuardias=null;
      mostrarError(resultado&&resultado.mensaje?resultado.mensaje:"No fue posible consultar el resultado.");
      return;
    }

    const datos=resultado.datos||{};

    if(datos.estado==="PENDIENTE"){
      setTimeout(consultarResultado,700);
      return;
    }

    if(datos.estado!=="LISTO"||!datos.resultado){
      avisoEnviando=false;
      operacionAvisoGuardias=null;
      mostrarError("No fue posible recuperar el resultado del envío.");
      return;
    }

    const envio=datos.resultado;

    avisoEnviando=false;
    operacionAvisoGuardias=null;

    if(!envio.ok){
      mostrarError(envio.mensaje||"No fue posible enviar el aviso.");
      return;
    }

    const detalle=envio.datos||{};

    mostrarMensaje(
      "✅ Aviso enviado correctamente a "+
      String(detalle.enviados||0)+
      " dispositivo(s)."
    );
  };

  const anterior=document.getElementById("consultaAvisoGuardias");
  if(anterior)anterior.remove();

  const script=document.createElement("script");
  script.id="consultaAvisoGuardias";
  script.src=URL_BACKEND+
    "?api=operacionEstado"+
    "&requestId="+encodeURIComponent(operacionAvisoGuardias.requestId)+
    "&callback="+encodeURIComponent(callback)+
    "&t="+Date.now();

  script.onerror=function(){
    script.remove();
    if(operacionAvisoGuardias){
      setTimeout(consultarResultado,700);
    }
  };

  document.body.appendChild(script);
}

function mostrarMensaje(texto){
  const m=document.getElementById("mensaje");
  m.textContent=texto;
  m.style.background="#e9f7ee";
  m.style.color="#267245";
  m.style.display="block";
  setTimeout(()=>m.style.display="none",3500);
}

function mostrarError(texto){
  const m=document.getElementById("mensaje");
  m.textContent=texto;
  m.style.background="#fdeaea";
  m.style.color="#9b3333";
  m.style.display="block";
  setTimeout(()=>{
    m.style.display="none";
    m.style.background="#e9f7ee";
    m.style.color="#267245";
  },4500);
}

function volverGuardias(){
  location.href="guardias.html";
}

window.addEventListener("click",e=>{
  if(e.target===document.getElementById("modal")){
    cerrarModal();
  }
});
</script>
</body>
</html>
