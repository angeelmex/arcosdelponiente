<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#204d5d"
  >

  <title>Estados de cuenta</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #204d5d;
    }

    .pagina {
      min-height: 100vh;
      padding: 16px 14px 40px;
    }

    .contenedor {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .cabecera h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.05;
    }

    .cabecera .sub {
      margin-top: 5px;
      color: #718198;
      font-size: 13px;
    }

    .volver {
      border: none;
      border-radius: 14px;
      background: white;
      color: #204d5d;
      font-weight: 800;
      padding: 12px 14px;
      box-shadow: 0 5px 18px rgba(20,55,95,.08);
      cursor: pointer;
    }

    .tarjeta {
      background: white;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 6px 22px rgba(20,55,95,.08);
    }

    .titulo-seccion {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 900;
    }

    .estado-principal {
      text-align: center;
      padding: 23px 18px;
    }

    .estado-etiqueta {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .al-corriente {
      background: #e8f7ed;
      color: #237443;
    }

    .atrasado {
      background: #fdeaea;
      color: #a33b3b;
    }

    .periodo {
      background: #fff5d9;
      color: #866100;
    }

    .exento {
      background: #e9f2f6;
      color: #315f71;
    }

    .sin-mes {
      background: #eef1f4;
      color: #65717e;
    }

    .nombre {
      font-size: 22px;
      font-weight: 900;
    }

    .domicilio {
      color: #718198;
      margin-top: 4px;
      font-size: 14px;
    }

    .limite {
      margin-top: 12px;
      color: #65717e;
      font-size: 13px;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dato {
      background: #f6f8fa;
      border-radius: 16px;
      padding: 14px;
      min-height: 92px;
    }

    .dato .etiqueta {
      color: #718198;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .dato .valor {
      margin-top: 7px;
      font-size: 21px;
      font-weight: 900;
      color: #204d5d;
    }

    .saldo {
      grid-column: 1 / -1;
      background: #eaf4f2;
    }

    .saldo .valor {
      font-size: 30px;
    }

    .meses {
      display: grid;
      gap: 9px;
    }

    .mes {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f2;
    }

    .mes:last-child {
      border-bottom: none;
    }

    .mes-nombre {
      font-weight: 900;
    }

    .mes-estado {
      font-size: 12px;
      font-weight: 800;
      color: #718198;
    }

    .mes-importe {
      min-width: 72px;
      text-align: right;
      font-weight: 900;
    }

    .participacion-item {
      margin-bottom: 13px;
    }

    .participacion-linea {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .barra {
      height: 10px;
      background: #edf1f3;
      border-radius: 999px;
      overflow: hidden;
    }

    .barra > div {
      height: 100%;
      background: #6aa84f;
      border-radius: 999px;
    }

    .buscador {
      width: 100%;
      border: 1px solid #dbe3e8;
      background: #f9fbfc;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    .vecinos {
      display: grid;
      gap: 8px;
    }

    .vecino {
      border: 1px solid #edf0f2;
      border-radius: 14px;
      padding: 12px 13px;
    }

    .vecino-arriba {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .vecino-nombre {
      font-weight: 900;
      font-size: 14px;
    }

    .vecino-dir {
      color: #718198;
      font-size: 12px;
      margin-top: 3px;
    }

    .mini-estado {
      font-size: 10px;
      font-weight: 900;
      border-radius: 999px;
      padding: 6px 8px;
      white-space: nowrap;
    }

    .gasto {
      padding: 12px 0;
      border-bottom: 1px solid #edf0f2;
    }

    .gasto:last-child {
      border-bottom: none;
    }

    .gasto-arriba {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
      font-size: 14px;
    }

    .gasto-detalle {
      color: #718198;
      font-size: 12px;
      margin-top: 4px;
    }

    .estado-carga {
      text-align: center;
      padding: 40px 18px;
      color: #718198;
    }

    .error {
      color: #9d3636;
    }

    .reintentar {
      margin-top: 14px;
      border: none;
      border-radius: 14px;
      background: #204d5d;
      color: white;
      font-weight: 900;
      padding: 13px 18px;
      cursor: pointer;
    }

    .nota {
      color: #7b8998;
      font-size: 12px;
      line-height: 1.45;
      margin-top: 12px;
    }

    @media (max-width: 420px) {
      .resumen {
        grid-template-columns: 1fr 1fr;
      }

      .dato .valor {
        font-size: 18px;
      }

      .saldo .valor {
        font-size: 27px;
      }
    }

  </style>

  <script defer src="./conexion-residente.js?v=20260828-1"></script>

</head>

<body>

<div class="pagina">

  <div class="contenedor">

    <div class="cabecera">

      <div>
        <h1>💳 Estados de cuenta</h1>
        <div class="sub">
          Aportaciones y finanzas de la colonia
        </div>
      </div>

      <button
        class="volver"
        onclick="volverMenu()"
      >
        MENÚ
      </button>

    </div>


    <div
      id="contenido"
      class="tarjeta estado-carga"
    >
      Cargando información...
    </div>

  </div>

</div>


<iframe
  id="frameOperacion"
  name="frameOperacion"
  style="display:none;"
></iframe>


<form
  id="formOperacion"
  method="post"
  target="frameOperacion"
  style="display:none;"
>

  <input
    id="campoAccion"
    name="accion"
  >

  <input
    id="campoRequestId"
    name="requestId"
  >

  <input
    id="campoToken"
    name="token"
  >

</form>


<script>

const URL_BACKEND =
  "https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec";


const TOKEN =
  sessionStorage.getItem(
    "tokenResidente"
  ) || "";


let requestActual =
  "";


let consultas =
  0;


const MAX_CONSULTAS =
  26;



document.addEventListener(
  "DOMContentLoaded",
  function() {

    if (
      !TOKEN
    ) {

      window.location.href =
        "login.html";

      return;

    }


    cargarEstadoCuenta();

  }
);



function volverMenu() {

  window.location.href =
    "menu.html";

}



const MINUTOS_CACHE_LOCAL_ESTADO_CUENTA_V3 =
  10;

const MILISEGUNDOS_CACHE_LOCAL_ESTADO_CUENTA_V3 =
  MINUTOS_CACHE_LOCAL_ESTADO_CUENTA_V3 *
  60 *
  1000;



function obtenerClaveCacheLocalEstadoCuentaV3_() {

  try {

    const residenteTexto =
      sessionStorage.getItem(
        "residente"
      );


    if (
      !residenteTexto
    ) {

      return "";

    }


    const residente =
      JSON.parse(
        residenteTexto
      );


    const idResidente =
      residente &&
      residente.idResidente
        ? String(
            residente.idResidente
          )
        : "";


    if (
      !idResidente
    ) {

      return "";

    }


    return (
      "arcos_estado_cuenta_v3_" +
      idResidente
    );

  }
  catch (error) {

    return "";

  }

}



function obtenerCacheLocalEstadoCuentaV3_() {

  try {

    const clave =
      obtenerClaveCacheLocalEstadoCuentaV3_();


    if (
      !clave
    ) {

      return null;

    }


    const cacheTexto =
      localStorage.getItem(
        clave
      );


    if (
      !cacheTexto
    ) {

      return null;

    }


    const cache =
      JSON.parse(
        cacheTexto
      );


    if (
      !cache ||
      !cache.fecha ||
      !cache.datos
    ) {

      return null;

    }


    return cache;

  }
  catch (error) {

    return null;

  }

}



function guardarCacheLocalEstadoCuentaV3_(
  datos
) {

  try {

    const clave =
      obtenerClaveCacheLocalEstadoCuentaV3_();


    if (
      !clave
    ) {

      return;

    }


    localStorage.setItem(
      clave,
      JSON.stringify(
        {
          fecha:
            Date.now(),

          datos:
            datos
        }
      )
    );

  }
  catch (error) {

    /*
     * El caché local es solo una optimización.
     * Si falla, la página funciona como antes.
     */

  }

}



function cargarEstadoCuenta(
  forzarActualizacion
) {

  /*
   * Para una entrada normal intentamos primero
   * la copia local del teléfono.
   */
  if (
    !forzarActualizacion
  ) {

    const cacheLocal =
      obtenerCacheLocalEstadoCuentaV3_();


    if (
      cacheLocal &&
      Date.now() -
        cacheLocal.fecha <
        MILISEGUNDOS_CACHE_LOCAL_ESTADO_CUENTA_V3
    ) {

      pintar(
        cacheLocal.datos
      );

      return;

    }

  }


  mostrarCargando();


  requestActual =
    generarRequestId();


  consultas =
    0;


  document
    .getElementById(
      "formOperacion"
    )
    .action =
      URL_BACKEND;


  document
    .getElementById(
      "campoAccion"
    )
    .value =
      "estadoCuentaDatos";


  document
    .getElementById(
      "campoRequestId"
    )
    .value =
      requestActual;


  document
    .getElementById(
      "campoToken"
    )
    .value =
      TOKEN;


  document
    .getElementById(
      "formOperacion"
    )
    .submit();


  setTimeout(
    consultarEstado,
    450
  );

}


function consultarEstado() {

  if (
    !requestActual
  ) {

    return;

  }


  consultas++;


  if (
    consultas >
      MAX_CONSULTAS
  ) {

    mostrarError(
      "La información está tardando más de lo normal."
    );


    requestActual =
      "";

    return;

  }


  const callback =
    "cbEstadoCuenta_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  window[
    callback
  ] =
    function(resultado) {

      try {
        delete window[callback];
      }
      catch (error) {}


      if (
        !resultado ||
        !resultado.ok
      ) {

        mostrarError(
          resultado &&
          resultado.mensaje
            ? resultado.mensaje
            : "No fue posible consultar el estado de cuenta."
        );


        requestActual =
          "";

        return;

      }


      const datos =
        resultado.datos || {};


      if (
        datos.estado ===
          "PENDIENTE"
      ) {

        setTimeout(
          consultarEstado,
          450
        );

        return;

      }


      if (
        datos.estado !==
          "LISTO"
      ) {

        mostrarError(
          "No fue posible recuperar la información."
        );


        requestActual =
          "";

        return;

      }


      requestActual =
        "";


      const respuesta =
        datos.resultado;


      if (
        !respuesta ||
        !respuesta.ok
      ) {

        mostrarError(
          respuesta &&
          respuesta.mensaje
            ? respuesta.mensaje
            : "No fue posible cargar el estado de cuenta."
        );

        return;

      }


      const datosEstadoCuenta =
        respuesta.datos || {};


      guardarCacheLocalEstadoCuentaV3_(
        datosEstadoCuenta
      );


      pintar(
        datosEstadoCuenta
      );

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    URL_BACKEND +
    "?api=operacionEstado" +
    "&requestId=" +
    encodeURIComponent(
      requestActual
    ) +
    "&callback=" +
    encodeURIComponent(
      callback
    ) +
    "&t=" +
    Date.now();


  script.onload =
    function() {

      try {
        script.remove();
      }
      catch (error) {}

    };


  script.onerror =
    function() {

      try {
        script.remove();
      }
      catch (error) {}


      setTimeout(
        consultarEstado,
        650
      );

    };


  document.body.appendChild(
    script
  );

}



function pintar(
  datos
) {

  const mi =
    datos.miCuenta;


  const resumen =
    datos.resumen || {};


  const participacion =
    datos.participacion || [];


  const vecinos =
    datos.vecinos || [];


  const gastos =
    datos.gastos || [];


  let html =
    "";


  if (
    mi
  ) {

    html +=
      '<div class="tarjeta estado-principal">' +
        '<div class="estado-etiqueta ' +
          claseEstado(
            mi.estadoActual
          ) +
        '">' +
          escapar(
            mi.estadoActual
          ) +
        '</div>' +
        '<div class="nombre">' +
          escapar(
            mi.dueno ||
            mi.idResidente
          ) +
        '</div>' +
        '<div class="domicilio">' +
          escapar(
            mi.calle
          ) +
          ' #' +
          escapar(
            mi.numero
          ) +
        '</div>' +
        '<div class="limite">' +
          'Fecha límite de pago: día ' +
          escapar(
            datos.fechaLimiteDia || 5
          ) +
          ' de cada mes' +
        '</div>' +
      '</div>';


    html +=
      '<div class="tarjeta">' +
        '<div class="titulo-seccion">Mis aportaciones</div>' +
        '<div class="meses">';


    (mi.pagos || [])
      .forEach(
        function(pago) {

          let estado =
            "Pendiente";


          if (
            pago.exento
          ) {

            estado =
              "Exento";

          }
          else if (
            pago.tienePago
          ) {

            estado =
              "Pagado";

          }


          html +=
            '<div class="mes">' +
              '<div class="mes-nombre">' +
                escapar(
                  pago.mes
                ) +
              '</div>' +
              '<div class="mes-estado">' +
                escapar(
                  estado
                ) +
              '</div>' +
              '<div class="mes-importe">' +
                (
                  pago.exento
                    ? "EXENTO"
                    : (
                        pago.tienePago
                          ? dinero(
                              pago.valor
                            )
                          : "—"
                      )
                ) +
              '</div>' +
            '</div>';

        }
      );


    html +=
        '</div>' +
      '</div>';

  }
  else {

    html +=
      '<div class="tarjeta">' +
        '<div class="titulo-seccion">Mi estado</div>' +
        '<div class="nota">' +
          'Tu ID de residente no fue encontrado en la hoja ESTADOS_DE_CUENTA. ' +
          'Los datos generales sí pueden consultarse.' +
        '</div>' +
      '</div>';

  }


  html +=
    '<div class="tarjeta">' +
      '<div class="titulo-seccion">Resumen de la colonia</div>' +
      '<div class="resumen">' +

        '<div class="dato">' +
          '<div class="etiqueta">Aportaciones</div>' +
          '<div class="valor">' +
            dinero(
              resumen.ingresosAcumulados
            ) +
          '</div>' +
        '</div>' +

        '<div class="dato">' +
          '<div class="etiqueta">Gastos</div>' +
          '<div class="valor">' +
            dinero(
              resumen.gastosAcumulados
            ) +
          '</div>' +
        '</div>' +

        '<div class="dato saldo">' +
          '<div class="etiqueta">Saldo disponible</div>' +
          '<div class="valor">' +
            dinero(
              resumen.saldo
            ) +
          '</div>' +
        '</div>' +

        '<div class="dato">' +
          '<div class="etiqueta">Participan</div>' +
          '<div class="valor">' +
            escapar(
              resumen.totalCuotas || 0
            ) +
            ' / ' +
            escapar(
              resumen.totalCasas || 0
            ) +
          '</div>' +
        '</div>' +

        '<div class="dato">' +
          '<div class="etiqueta">Participación</div>' +
          '<div class="valor">' +
            porcentaje(
              resumen.porcentajeGeneral
            ) +
          '</div>' +
        '</div>' +

      '</div>' +

      '<div class="nota">' +
        'Actualizado: ' +
        escapar(
          datos.fechaConsulta || ""
        ) +
      '</div>' +
    '</div>';


  if (
    participacion.length
  ) {

    html +=
      '<div class="tarjeta">' +
        '<div class="titulo-seccion">Participación por calle</div>';


    participacion.forEach(
      function(item) {

        const porc =
          Math.max(
            0,
            Math.min(
              100,
              Number(
                item.porcentaje || 0
              )
            )
          );


        html +=
          '<div class="participacion-item">' +
            '<div class="participacion-linea">' +
              '<span>' +
                escapar(
                  item.calle
                ) +
              '</span>' +
              '<span>' +
                escapar(
                  item.cuotas
                ) +
                '/' +
                escapar(
                  item.casas
                ) +
                ' · ' +
                porcentaje(
                  item.porcentaje
                ) +
              '</span>' +
            '</div>' +
            '<div class="barra">' +
              '<div style="width:' +
                porc +
              '%"></div>' +
            '</div>' +
          '</div>';

      }
    );


    html +=
      '</div>';

  }


  if (
    gastos.length
  ) {

    html +=
      '<div class="tarjeta">' +
        '<div class="titulo-seccion">Gastos</div>';


    gastos.forEach(
      function(gasto) {

        const mesesConValor =
          (gasto.meses || [])
            .filter(
              function(m) {

                return Number(
                  m.valor || 0
                ) !== 0;

              }
            )
            .map(
              function(m) {

                return (
                  m.mes +
                  ': ' +
                  dinero(
                    m.valor
                  )
                );

              }
            )
            .join(
              ' · '
            );


        html +=
          '<div class="gasto">' +
            '<div class="gasto-arriba">' +
              '<span>' +
                escapar(
                  gasto.concepto
                ) +
              '</span>' +
              '<span>' +
                dinero(
                  gasto.total
                ) +
              '</span>' +
            '</div>' +
            '<div class="gasto-detalle">' +
              (
                gasto.recurrente
                  ? (
                      'Recurrente: ' +
                      escapar(
                        gasto.recurrente
                      )
                    )
                  : ''
              ) +
              (
                gasto.recurrente &&
                mesesConValor
                  ? ' · '
                  : ''
              ) +
              escapar(
                mesesConValor
              ) +
            '</div>' +
          '</div>';

      }
    );


    html +=
      '</div>';

  }


  html +=
    '<div class="tarjeta">' +
      '<div class="titulo-seccion">Aportaciones de vecinos</div>' +

      '<input ' +
        'id="buscadorVecinos" ' +
        'class="buscador" ' +
        'type="search" ' +
        'placeholder="Buscar nombre, calle o número..." ' +
        'oninput="filtrarVecinos()"' +
      '>' +

      '<div id="listaVecinos" class="vecinos"></div>' +

      '<div class="nota">' +
        'Esta sección permite consultar las aportaciones registradas de las casas de la colonia.' +
      '</div>' +
    '</div>';


  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.className =
    "";


  contenido.innerHTML =
    html;


  window.__vecinosEstadoCuenta =
    vecinos;


  pintarVecinos(
    vecinos
  );

}



function pintarVecinos(
  vecinos
) {

  const lista =
    document.getElementById(
      "listaVecinos"
    );


  if (
    !lista
  ) {

    return;

  }


  if (
    !vecinos.length
  ) {

    lista.innerHTML =
      '<div class="nota">No hay residentes para mostrar.</div>';

    return;

  }


  lista.innerHTML =
    vecinos.map(
      function(v) {

        return (
          '<div class="vecino">' +
            '<div class="vecino-arriba">' +
              '<div>' +
                '<div class="vecino-nombre">' +
                  escapar(
                    v.dueno ||
                    'Casa sin nombre registrado'
                  ) +
                '</div>' +
                '<div class="vecino-dir">' +
                  escapar(
                    v.calle
                  ) +
                  ' #' +
                  escapar(
                    v.numero
                  ) +
                  ' · ' +
                  escapar(
                    v.idResidente
                  ) +
                '</div>' +
              '</div>' +
              '<div class="mini-estado ' +
                claseEstado(
                  v.estadoActual
                ) +
              '">' +
                escapar(
                  v.estadoActual
                ) +
              '</div>' +
            '</div>' +
          '</div>'
        );

      }
    )
    .join(
      ""
    );

}



function filtrarVecinos() {

  const input =
    document.getElementById(
      "buscadorVecinos"
    );


  const termino =
    normalizar(
      input
        ? input.value
        : ""
    );


  const todos =
    window.__vecinosEstadoCuenta ||
    [];


  if (
    !termino
  ) {

    pintarVecinos(
      todos
    );

    return;

  }


  pintarVecinos(
    todos.filter(
      function(v) {

        const textoBuscar =
          normalizar(
            [
              v.dueno,
              v.calle,
              v.numero,
              v.idResidente
            ].join(
              " "
            )
          );


        return textoBuscar
          .indexOf(
            termino
          ) >= 0;

      }
    )
  );

}



function claseEstado(
  estado
) {

  const e =
    normalizar(
      estado
    );


  if (
    e ===
      "al corriente"
  ) {

    return "al-corriente";

  }


  if (
    e ===
      "atrasado"
  ) {

    return "atrasado";

  }


  if (
    e ===
      "en periodo de pago"
  ) {

    return "periodo";

  }


  if (
    e ===
      "exento"
  ) {

    return "exento";

  }


  return "sin-mes";

}



function dinero(
  valor
) {

  return new Intl.NumberFormat(
    "es-MX",
    {
      style:
        "currency",

      currency:
        "MXN",

      minimumFractionDigits:
        2
    }
  )
  .format(
    Number(
      valor || 0
    )
  );

}



function porcentaje(
  valor
) {

  return (
    Number(
      valor || 0
    )
    .toFixed(
      2
    )
    .replace(
      ".",
      ","
    ) +
    "%"
  );

}



function mostrarCargando() {

  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.className =
    "tarjeta estado-carga";


  contenido.innerHTML =
    "Cargando información...";

}



function mostrarError(
  mensaje
) {

  const contenido =
    document.getElementById(
      "contenido"
    );


  contenido.className =
    "tarjeta estado-carga error";


  contenido.innerHTML =
    escapar(
      mensaje
    ) +
    '<br>' +
    '<button class="reintentar" onclick="cargarEstadoCuenta()">' +
      'REINTENTAR' +
    '</button>';

}



function generarRequestId() {

  if (
    window.crypto &&
    window.crypto.randomUUID
  ) {

    return window.crypto
      .randomUUID()
      .replace(
        /-/g,
        ""
      );

  }


  return (
    Date.now()
      .toString(
        36
      ) +
    Math.random()
      .toString(
        36
      )
      .substring(
        2
      ) +
    Math.random()
      .toString(
        36
      )
      .substring(
        2
      )
  );

}



function escapar(
  valor
) {

  return String(
    valor == null
      ? ""
      : valor
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



function normalizar(
  valor
) {

  return String(
    valor == null
      ? ""
      : valor
  )
  .normalize(
    "NFD"
  )
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .toLowerCase()
  .trim();

}
