<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Acceso de residente</title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f4f7fb;

      color:
        #204d5d;

    }


    .pagina {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 22px 17px;

    }


    .contenedor {

      width: 100%;

      max-width: 480px;

    }


    .tarjeta {

      background: white;

      border-radius: 26px;

      padding:
        28px 23px;

      box-shadow:
        0 9px 30px
        rgba(20, 55, 95, 0.12);

    }


    .logo {

      display: none;

      width: 100%;

      max-width: 330px;

      max-height: 130px;

      object-fit: contain;

      margin:
        0 auto 22px;

    }


    h1 {

      margin:
        0 0 6px;

      text-align: center;

      font-size: 27px;

      color:
        #204d5d;

    }


    .subtitulo {

      text-align: center;

      color:
        #738398;

      margin-bottom: 30px;

    }


    .etiqueta {

      display: block;

      margin-bottom: 8px;

      font-size: 15px;

      font-weight: 800;

    }


    .campo {

      position: relative;

    }


    input {

      width: 100%;

      height: 64px;

      padding:
        0 60px 0 18px;

      border:
        2px solid #dce5ec;

      border-radius: 17px;

      outline: none;

      font-size: 21px;

    }


    input:focus {

      border-color:
        #b7d52b;

    }


    .ojo {

      position: absolute;

      right: 7px;

      top: 7px;

      width: 50px;

      height: 50px;

      border: none;

      border-radius: 14px;

      background:
        #edf3f6;

      font-size: 21px;

      cursor: pointer;

    }


    .privacidad {

      margin:
        10px 2px 24px;

      color:
        #748398;

      font-size: 13px;

    }


    .boton {

      width: 100%;

      height: 64px;

      border: none;

      border-radius: 18px;

      background:
        #204d5d;

      color: white;

      font-size: 20px;

      font-weight: 800;

      cursor: pointer;

    }


    .boton:disabled {

      opacity: 0.6;

    }


    .mensaje {

      display: none;

      margin-top: 17px;

      padding: 14px;

      border-radius: 14px;

      text-align: center;

      font-weight: 700;

    }


    .mensaje.error {

      display: block;

      color:
        #9e2929;

      background:
        #fdecec;

    }


    .mensaje.ok {

      display: block;

      color:
        #24652d;

      background:
        #eaf7ec;

    }


    .volver {

      margin-top: 19px;

      text-align: center;

    }


    .volver button {

      border: none;

      background: none;

      color:
        #204d5d;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

    }


    .iframe-post {

      display: none;

      width: 0;

      height: 0;

      border: 0;

    }

  </style>

</head>


<body>


<div class="pagina">

  <div class="contenedor">

    <div class="tarjeta">


      <img
        id="logo"
        class="logo"
        alt="Arcos del Poniente"
        decoding="async"
        fetchpriority="high"
      >


      <h1>
        Acceso de residente
      </h1>


      <div class="subtitulo">
        Ingresa tu contraseña para continuar
      </div>


      <label
        class="etiqueta"
        for="contrasena"
      >
        Contraseña
      </label>


      <div class="campo">


        <input
          type="password"
          id="contrasena"
          placeholder="Escribe tu contraseña"
          autocomplete="current-password"
          onkeydown="detectarEnter(event)"
        >


        <button
          type="button"
          class="ojo"
          onclick="mostrarOcultar()"
          aria-label="Mostrar u ocultar contraseña"
        >
          👁️
        </button>


      </div>


      <div class="privacidad">
        🔒 Por seguridad, tu contraseña
        se mantiene oculta.
      </div>


      <button
        id="btnIngresar"
        class="boton"
        onclick="iniciarSesion()"
      >
        INGRESAR
      </button>


      <div
        id="mensaje"
        class="mensaje"
      ></div>


      <div class="volver">

        <button
          type="button"
          onclick="volverAvisos()"
        >
          ← Volver a avisos
        </button>

      </div>


    </div>

  </div>

</div>


<form
  id="formLogin"
  method="post"
  action="https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec"
  target="iframeLogin"
  style="display:none;"
>

  <input
    type="hidden"
    name="accion"
    value="login"
  >


  <input
    type="hidden"
    id="postContrasena"
    name="contrasena"
    value=""
  >


  <input
    type="hidden"
    id="postRequestId"
    name="requestId"
    value=""
  >

</form>


<iframe
  id="iframeLogin"
  name="iframeLogin"
  class="iframe-post"
  title="Procesando acceso"
></iframe>


<script>


const URL_BACKEND =
  "https://script.google.com/macros/s/AKfycbz_3pO_96W-JNPCzXC7uPehAf9UbgUb1QiQsd9s5F1oiNwxvrS_FRiL0G07UVsxPZE4/exec";

/*
 * Reutiliza el mismo cache visual de index.html.
 * Así el logo puede aparecer de inmediato al entrar al login.
 */
const CACHE_DATOS_PUBLICOS_V3 =
  "arcos_datos_publicos_v3";

const MAX_EDAD_CACHE_LOGO_MS =
  90 * 24 * 60 * 60 * 1000;


function guardarCacheDatosPublicosLoginV3_(
  datos
) {

  try {

    localStorage.setItem(
      CACHE_DATOS_PUBLICOS_V3,
      JSON.stringify(
        {
          fecha:
            Date.now(),

          datos:
            datos || {}
        }
      )
    );

  }
  catch (error) {}

}



function leerCacheDatosPublicosLoginV3_() {

  try {

    const textoCache =
      localStorage.getItem(
        CACHE_DATOS_PUBLICOS_V3
      );


    if (
      !textoCache
    ) {

      return null;

    }


    const cache =
      JSON.parse(
        textoCache
      );


    if (
      !cache ||
      !cache.fecha ||
      !cache.datos ||
      Date.now() -
        Number(cache.fecha) >
        MAX_EDAD_CACHE_LOGO_MS
    ) {

      return null;

    }


    return cache.datos;

  }
  catch (error) {

    return null;

  }

}



function pintarLogoLoginV3_(
  datos
) {

  datos =
    datos || {};


  const urlLogo =
    datos.urlLogo;


  if (
    !urlLogo
  ) {

    return;

  }


  const logo =
    document.getElementById(
      "logo"
    );


  logo.onload =
    function() {

      logo.style.display =
        "block";

    };


  if (
    logo.src !==
      urlLogo
  ) {

    logo.src =
      urlLogo;

  }

}



let requestLoginActual =
  "";


let loginEnProceso =
  false;


let consultasRealizadas =
  0;


let temporizadorLimiteLogin =
  null;


const MAX_CONSULTAS =
  22;


const LIMITE_TOTAL_LOGIN_MS =
  18000;


/*************************************************
 * INICIO
 *************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    cargarDatosPublicos();

  }
);


/*************************************************
 * DATOS PÚBLICOS / LOGO
 *************************************************/

function cargarDatosPublicos() {

  /*
   * Si el usuario viene de Inicio, el logo ya está guardado
   * y aparece inmediatamente.
   */
  const cache =
    leerCacheDatosPublicosLoginV3_();


  if (
    cache
  ) {

    pintarLogoLoginV3_(
      cache
    );

  }


  window.recibirDatosLogin =
    function(resultado) {

      if (
        !resultado ||
        !resultado.ok ||
        !resultado.datos
      ) {

        return;

      }


      guardarCacheDatosPublicosLoginV3_(
        resultado.datos
      );


      pintarLogoLoginV3_(
        resultado.datos
      );

    };


  /*
   * La comprobación contra Apps Script sigue ocurriendo en
   * segundo plano cada vez. Si cambias el logo, se actualizará
   * sin esperar a que venza el cache.
   */
  const script =
    document.createElement(
      "script"
    );


  script.src =
    URL_BACKEND +
    "?api=inicio" +
    "&callback=recibirDatosLogin" +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


/*************************************************
 * MOSTRAR / OCULTAR CONTRASEÑA
 *************************************************/

function mostrarOcultar() {

  const campo =
    document.getElementById(
      "contrasena"
    );


  campo.type =
    campo.type === "password"
      ? "text"
      : "password";

}


/*************************************************
 * ENTER
 *************************************************/

function detectarEnter(evento) {

  if (
    evento.key === "Enter"
  ) {

    iniciarSesion();

  }

}


/*************************************************
 * LOGIN
 *************************************************/

function iniciarSesion() {

  if (
    loginEnProceso
  ) {

    return;

  }


  const contrasena =
    document
      .getElementById(
        "contrasena"
      )
      .value
      .trim();


  if (
    !contrasena
  ) {

    mostrarError(
      "Ingresa tu contraseña."
    );

    return;

  }


  loginEnProceso =
    true;


  consultasRealizadas =
    0;


  requestLoginActual =
    generarRequestId();


  const boton =
    document.getElementById(
      "btnIngresar"
    );


  boton.disabled =
    true;


  boton.textContent =
    "VERIFICANDO...";


  ocultarMensaje();


  document
    .getElementById(
      "postContrasena"
    )
    .value =
      contrasena;


  document
    .getElementById(
      "postRequestId"
    )
    .value =
      requestLoginActual;


  /*
   * Mandamos la contraseña una sola vez,
   * mediante POST y dentro de un iframe oculto.
   */
  document
    .getElementById(
      "formLogin"
    )
    .submit();


  if (
    temporizadorLimiteLogin
  ) {

    clearTimeout(
      temporizadorLimiteLogin
    );

  }


  temporizadorLimiteLogin =
    setTimeout(
      function() {

        if (
          loginEnProceso
        ) {

          finalizarConError(
            "El servidor está tardando más de lo normal. Presiona INGRESAR para intentar nuevamente."
          );

        }

      },
      LIMITE_TOTAL_LOGIN_MS
    );


  /*
   * Damos un pequeño margen para que el POST
   * llegue al backend y después comenzamos
   * a preguntar por el resultado.
   */
  setTimeout(
    consultarEstadoLogin,
    700
  );

}


/*************************************************
 * CONSULTA DEL RESULTADO
 *************************************************/

function consultarEstadoLogin() {

  if (
    !loginEnProceso ||
    !requestLoginActual
  ) {

    return;

  }


  consultasRealizadas++;


  if (
    consultasRealizadas >
    MAX_CONSULTAS
  ) {

    finalizarConError(
      "El servidor está tardando más de lo normal. Presiona INGRESAR para intentar nuevamente."
    );

    return;

  }


  const nombreCallback =
    "recibirEstadoLoginV3";


  window[
    nombreCallback
  ] =
    function(resultado) {

      procesarEstadoLogin(
        resultado
      );

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "consultaLoginV3";


  script.src =
    URL_BACKEND +
    "?api=loginEstado" +
    "&requestId=" +
    encodeURIComponent(
      requestLoginActual
    ) +
    "&callback=" +
    nombreCallback +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      eliminarScriptConsulta();


      if (
        loginEnProceso
      ) {

        setTimeout(
          consultarEstadoLogin,
          700
        );

      }

    };


  document.body.appendChild(
    script
  );

}


/*************************************************
 * PROCESAR ESTADO
 *************************************************/

function procesarEstadoLogin(
  resultado
) {

  eliminarScriptConsulta();


  if (
    !loginEnProceso
  ) {

    return;

  }


  if (
    !resultado ||
    !resultado.ok
  ) {

    finalizarConError(
      resultado &&
      resultado.mensaje
        ? resultado.mensaje
        : "No fue posible validar tu acceso."
    );

    return;

  }


  const datos =
    resultado.datos || {};


  if (
    datos.estado ===
    "PENDIENTE"
  ) {

    setTimeout(
      consultarEstadoLogin,
      700
    );

    return;

  }


  if (
    datos.estado !==
      "LISTO" ||
    !datos.resultado
  ) {

    finalizarConError(
      "No fue posible recuperar el resultado del acceso."
    );

    return;

  }


  procesarResultadoLogin(
    datos.resultado
  );

}


/*************************************************
 * RESULTADO FINAL
 *************************************************/

function procesarResultadoLogin(
  resultado
) {

  loginEnProceso =
    false;


  if (
    temporizadorLimiteLogin
  ) {

    clearTimeout(
      temporizadorLimiteLogin
    );


    temporizadorLimiteLogin =
      null;

  }


  if (
    !resultado ||
    !resultado.ok
  ) {

    mostrarError(
      resultado &&
      resultado.mensaje
        ? resultado.mensaje
        : "No fue posible ingresar."
    );


    restaurarBoton();


    return;

  }


  const datos =
    resultado.datos || {};


  if (
    !datos.token
  ) {

    mostrarError(
      "No fue posible crear la sesión."
    );


    restaurarBoton();


    return;

  }


  sessionStorage.setItem(
    "tokenResidente",
    datos.token
  );


  if (
    datos.residente
  ) {

    sessionStorage.setItem(
      "residente",
      JSON.stringify(
        datos.residente
      )
    );

  }


  mostrarCorrecto(
    "Acceso correcto."
  );


  const boton =
    document.getElementById(
      "btnIngresar"
    );


  boton.textContent =
    "ACCESO CORRECTO";


  setTimeout(
    function() {

      window.location.href =
        "menu.html?v=20260820-1120";

    },
    350
  );

}


/*************************************************
 * LIMPIAR SCRIPT JSONP
 *************************************************/

function eliminarScriptConsulta() {

  const anterior =
    document.getElementById(
      "consultaLoginV3"
    );


  if (
    anterior
  ) {

    anterior.remove();

  }

}


/*************************************************
 * ERROR FINAL
 *************************************************/

function finalizarConError(
  texto
) {

  loginEnProceso =
    false;


  if (
    temporizadorLimiteLogin
  ) {

    clearTimeout(
      temporizadorLimiteLogin
    );


    temporizadorLimiteLogin =
      null;

  }


  eliminarScriptConsulta();


  mostrarError(
    texto
  );


  requestLoginActual =
    "";


  restaurarBoton();

}


/*************************************************
 * REQUEST ID ALEATORIO
 *************************************************/

function generarRequestId() {

  if (
    window.crypto &&
    typeof crypto.randomUUID ===
      "function"
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/*************************************************
 * VOLVER
 *************************************************/

function volverAvisos() {

  window.location.href =
    "./";

}


/*************************************************
 * BOTÓN
 *************************************************/

function restaurarBoton() {

  const boton =
    document.getElementById(
      "btnIngresar"
    );


  boton.disabled =
    false;


  boton.textContent =
    "INGRESAR";

}


/*************************************************
 * MENSAJES
 *************************************************/

function ocultarMensaje() {

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.className =
    "mensaje";


  mensaje.textContent =
    "";

}


function mostrarError(texto) {

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.className =
    "mensaje error";


  mensaje.textContent =
    texto;

}


function mostrarCorrecto(texto) {

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.className =
    "mensaje ok";


  mensaje.textContent =
    texto;

}


</script>


</body>

</html>
